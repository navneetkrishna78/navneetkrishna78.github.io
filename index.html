<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acta stock &amp; orders</title>
<style>
:root{--mill:#ECEFF2;--sheet:#fff;--ink:#17222B;--steel:#596875;--rule:#D6DDE3}
html,body{margin:0;background:var(--mill);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.w{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.c{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:28px 26px}
.m{display:grid;gap:5px;margin:0 0 20px}.m span{display:block;height:9px;border-radius:2px 3px 3px 2px;background:linear-gradient(180deg,#C6D1DA,#9AABBA 45%,#7C8FA0)}
.m span.b{background:linear-gradient(180deg,#B88A55,#9A6A35 50%,#7E5122)}
h1{font:600 25px/1.15 "Bahnschrift","Segoe UI",sans-serif;margin:0}p{color:var(--steel);margin:6px 0 0}
</style>
</head>
<body><div class="w"><div class="c">
<div class="m" aria-hidden="true"><span style="width:100%"></span><span class="b" style="width:74%"></span><span style="width:48%"></span></div>
<h1>Stock &amp; orders</h1><p>Acta International Industries Private Limited</p>
<p>This page is being set up. Please check back shortly.</p>
</div></div></body>
</html>
