<style>
:root{
  --black:#000000; --mill:#EDEEEF; --sheet:#FFFFFF; --ink:#151515; --steel:#5A5A5A; --faint:#8E8E8E;
  --rule:#D8D8D8; --rule2:#E9E9E9;
  --gold:#E2C545; --gold-text:#7A6206; --gold-soft:#FAF2D2;
  --bronze:var(--gold); --bronze-soft:var(--gold-soft);
  --silver:linear-gradient(180deg,#F6F6F6 0%,#D2D2D2 38%,#9A9A9A 100%);
  --hd-line:#2B2B2B; --hd-text:#F4F4F4; --hd-dim:#A6A6A6; --hd-field:#161616;
  --warn:#A3401E; --warn-soft:#FAE9E2; --ok:#2F6B4F; --ok-soft:#E4F1EA; --blue:#2D5675; --blue-soft:#E6EEF5;
  --display:"Bahnschrift","Barlow","DIN Alternate","Segoe UI","Nirmala UI","Noto Sans Devanagari",sans-serif;
  --text:"Segoe UI","Segoe UI Variable Text","Nirmala UI","Noto Sans Devanagari",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--mill);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14px/1.5 var(--text);background:var(--mill)}
button,input,select{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--steel)} .faint{color:var(--faint)}
[hidden]{display:none!important}

/* header: black band carrying the NKB badge */
.top{background:var(--black);color:var(--hd-text)}
.top-in{max-width:1320px;margin:0 auto;padding:14px 28px 0;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{width:56px;height:56px;flex:none;display:block}
.brand h1{margin:0;font:600 24px/1.1 var(--display);letter-spacing:-.2px;color:#fff}
.brand p{margin:3px 0 0;color:var(--hd-dim);font-size:13px}
.search{position:relative;display:block;max-width:600px;width:100%;justify-self:center}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--hd-dim)}
.search input{width:100%;height:44px;border:1px solid var(--hd-line);border-radius:8px;background:var(--hd-field);color:#fff;padding:0 44px 0 42px;font-size:15px}
.search input::placeholder{color:#8A8A8A}
.search input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(226,197,69,.25)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px var(--text);color:var(--hd-dim);border:1px solid var(--hd-line);border-radius:4px;padding:1px 6px;background:#0C0C0C}
.who{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.fresh{margin:0;color:var(--hd-dim);font-size:12px;text-align:right;line-height:1.35}
.fresh b{display:block;color:#fff;font-weight:600;font-size:13px}
.fresh .link{font-size:12px;color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:5px 9px;font-size:13px;cursor:pointer;color:var(--steel)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold)}
.top .seg{border-color:var(--hd-line)}
.top .seg button{background:var(--hd-field);color:var(--hd-dim)}
.top .seg button[aria-pressed=true]{background:var(--gold);color:#000;font-weight:600}
.iconbtn{border:1px solid var(--hd-line);background:var(--hd-field);border-radius:6px;height:32px;min-width:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--hd-dim);padding:0 8px;font-size:13px}
.iconbtn:hover{border-color:var(--gold);color:#fff}
.tabs{max-width:1320px;margin:0 auto;padding:6px 20px 0;display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 11px 12px;cursor:pointer;color:var(--hd-dim);border-bottom:3px solid transparent;white-space:nowrap;font-size:14.5px}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.tab .ct{margin-left:6px;font-size:12px;color:#7C7C7C;font-weight:400}
.tab .ico,.tab.mob,.tab .lbl-m{display:none}

main{max-width:1320px;margin:0 auto;padding:24px 28px 70px}
h2{font:600 19px/1.2 var(--display);margin:0 0 4px}
h3{font:600 15px/1.25 var(--display);margin:0 0 8px}
.sub{color:var(--steel);margin:0 0 16px;font-size:13.5px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.banner{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:9px 14px;margin:0 0 16px;font-size:13px}

/* overview */
.lede{font:500 24px/1.35 var(--display);margin:0 0 22px;max-width:42ch;letter-spacing:-.1px}
.lede .soft{color:var(--steel)}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.rack{padding:20px 22px 12px}
.rack-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.rack-head .sp{flex:1}
.toggle{display:flex;gap:7px;align-items:center;color:var(--steel);font-size:13px;cursor:pointer;user-select:none}
.series{padding:12px 0 6px;border-top:1px solid var(--rule2)}
.series:first-of-type{border-top:0}
.series-h{display:flex;justify-content:space-between;color:var(--steel);font-size:12.5px;margin:0 0 6px}
.series-h b{font:600 13.5px var(--display);color:var(--ink)}
.bar-row{display:grid;grid-template-columns:230px minmax(0,1fr) 92px 84px;gap:14px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:4px;cursor:pointer}
.bar-row:hover{background:var(--mill)}
.bar-row .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .nm .new{font-size:11px;color:var(--gold-text);margin-left:6px}
.track{height:14px;position:relative}
.alu{height:100%;border-radius:2px 3px 3px 2px;background:var(--silver);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset -3px 0 0 rgba(23,34,43,.18);min-width:3px}
.bar-row.zero .nm{color:var(--faint)}
.bar-row.zero .track{border-bottom:1px dashed var(--rule)}
.bar-row .v{font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.bar-row .w{font-variant-numeric:tabular-nums;text-align:right;color:var(--steel);font-size:12.5px}
.side section{padding:16px 20px;border-bottom:1px solid var(--rule2)}
.side section:last-child{border-bottom:0}
.flag{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--rule2);font-size:13px;cursor:pointer}
.flag:first-of-type{border-top:0}
.flag .b{font:600 13px var(--display);color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 7px;height:fit-content;white-space:nowrap}
.flag:hover .t{text-decoration:underline}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--steel)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.kv .tot{font-weight:600;border-top:1px solid var(--rule2);padding-top:5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles button{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:9px 10px;cursor:pointer;text-align:left}
.tiles button:hover{border-color:var(--ink)}
.tiles b{display:block;font:600 22px var(--display)}
.tiles span{font-size:12px;color:var(--steel)}
.tiles.four{grid-template-columns:repeat(2,1fr)}

/* tables */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--steel)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filter{height:36px;border:1px solid var(--rule);border-radius:6px;padding:0 10px;background:var(--sheet);min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 12.5px var(--text);color:var(--steel);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet);position:sticky;top:0}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--rule2);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7F9FA}
tr.open td{background:#F7F9FA}
tr.hl td{background:var(--bronze-soft)!important}
tfoot td{font-weight:600;border-top:1px solid var(--rule);border-bottom:0}
.detail td{background:#FAFBFC;padding:14px 18px 18px}
table.compact td{white-space:nowrap;padding:7px 12px}
.detail table.compact th{background:#FAFBFC}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.in{background:var(--blue-soft);color:var(--blue)} .pill.out{background:var(--gold-soft);color:var(--gold-text)} .pill.grey{background:var(--rule2);color:var(--steel)} .pill.dark{background:var(--ink);color:#fff}
.dev-hi{color:var(--warn);font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.empty{padding:32px 26px;text-align:left}
.empty h3{font-size:17px}
.empty p{color:var(--steel);max-width:62ch;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.grid2.wide{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.head-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.head-row .sp{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:7px 14px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--gold);font-weight:600}
.btn.primary:hover{background:#2A2A2A}
.btn[disabled]{opacity:.55;cursor:progress}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;padding:16px 20px;margin-bottom:18px}
.meta div span{display:block;color:var(--steel);font-size:12.5px}
.meta div b{font:600 17px var(--display)}
.note{background:var(--gold-soft);border-radius:6px;padding:10px 14px;margin:0 0 14px;font-size:13px;color:#4F4004}
.cat{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:12px;align-items:center;margin:6px 0}
.cat .alu{height:12px}
.res-group{margin-bottom:22px}
.res-group h3{display:flex;gap:8px;align-items:baseline}
.res-group h3 span{font:400 13px var(--text);color:var(--steel)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:10px 14px;border-bottom:1px solid var(--rule2);cursor:pointer;background:var(--sheet)}
.res:hover{background:#F7F9FA}
.res .t{font-weight:600} .res .d{color:var(--steel);font-size:12.5px;grid-column:1} .res .r{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
mark{background:#F6DFB8;color:inherit;border-radius:2px;padding:0 1px}

/* stage stepper and actions */
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint)}
.step i{width:10px;height:10px;border-radius:50%;border:2px solid var(--rule);display:inline-block}
.step.done{color:var(--steel)} .step.done i{background:var(--gold);border-color:#B89A22}
.step.cur{color:var(--ink);font-weight:600} .step.cur i{background:var(--sheet);border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.step+.step::before{content:"";width:18px;height:2px;background:var(--rule);display:inline-block;margin-right:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.bigbtn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--black);background:var(--black);color:var(--gold);font:600 14.5px var(--display);cursor:pointer}
.bigbtn:hover{background:#2A2A2A}
.bigbtn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule);font-weight:500}
.bigbtn.ghost:hover{border-color:var(--ink)}
.bigbtn[disabled]{opacity:.55;cursor:progress}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--steel)}
.hist li{padding:4px 0;border-top:1px solid var(--rule2)}
.hist li:first-child{border-top:0}

/* cards (phones) */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:13px 14px;min-width:0}
.card .c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .c-id{font:600 15px var(--display)}
.card .c-party{font-weight:600;margin:2px 0 0}
.card .c-meta{color:var(--steel);font-size:13px;margin:2px 0 0}
.card .c-items{font-size:13px;margin:8px 0 0;color:var(--ink)}
.card .c-more{margin-top:10px}
.card .c-detail{margin-top:12px;border-top:1px solid var(--rule2);padding-top:12px}
.card .acts{margin:10px 0 0}
.card .acts .bigbtn{flex:1}

/* forms */
.form{display:grid;gap:12px;max-width:440px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--steel)}
.form input,.form select{height:44px;border:1px solid var(--rule);border-radius:6px;padding:0 12px;font-size:15px;background:var(--sheet);color:var(--ink)}
.form input:focus,.form select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.form .row{display:flex;gap:8px}
.form .row input{flex:1;min-width:0}
.msg{font-size:13px;margin:0;min-height:1.2em}
.msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}
.creds{background:var(--ok-soft);border-radius:6px;padding:12px 14px;font-size:14px}
.creds code{font:600 15px ui-monospace,Consolas,monospace;background:var(--sheet);padding:1px 6px;border-radius:4px}
.menu-list{display:grid;gap:8px}
.menu-list button{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-size:15px;cursor:pointer;text-align:left}

/* login */
body.locked .top, body.locked main{display:none}
body.locked{background:var(--black)}
.lock{min-height:100vh;display:grid;place-items:center;align-content:center;gap:18px;padding:24px 16px;background:var(--black);color:var(--hd-dim)}
.lock .badge{width:132px;height:132px;display:block;margin:0 auto}
.lock form{width:100%;max-width:380px;background:var(--sheet);color:var(--ink);border-radius:10px;padding:22px 24px 20px}
.lock h1{font:600 24px/1.15 var(--display);margin:0;letter-spacing:-.2px}
.lock .firm{margin:4px 0 16px;color:var(--steel);font-size:13px}
.lock .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lock label.f{display:block;font-size:13px;color:var(--steel);margin:12px 0 6px}
.lock input[type=text],.lock input[type=password]{width:100%;height:46px;border:1px solid var(--rule);border-radius:6px;padding:0 12px;font-size:16px;background:var(--mill)}
.lock input:focus{outline:none;border-color:var(--ink);background:var(--sheet);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.lock .keep{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:13px;color:var(--steel);cursor:pointer}
.lock button[type=submit]{width:100%;height:46px;border:0;border-radius:6px;background:var(--black);color:var(--gold);font:600 15px var(--display);cursor:pointer}
.lock button[type=submit][disabled]{opacity:.65;cursor:progress}
.lock .err{color:var(--warn);font-size:13px;margin:10px 0 0;min-height:1.3em}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:8px;padding:11px 14px 11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(23,34,43,.25);max-width:calc(100vw - 32px)}
.toast.err{background:var(--warn)}
.toast button{border:0;background:none;color:var(--gold);font-weight:600;cursor:pointer;padding:4px}

@media (max-width:1100px){.ov,.grid2,.grid2.wide{grid-template-columns:minmax(0,1fr)}.ov .side{order:-1}.top-in{grid-template-columns:1fr auto;gap:12px}.search{grid-column:1/-1;grid-row:2;justify-self:stretch;max-width:none}.meta{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){
  main{padding:16px 14px 96px}
  .top-in{padding:12px 14px 12px}
  .brand h1{font-size:20px} .brand p{font-size:12px} .brand{gap:10px} .brand .logo{width:44px;height:44px}
  .fresh{display:none}
  .search kbd{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--black);border-top:1px solid var(--hd-line);padding:4px 4px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:0;max-width:none}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:7px 2px 5px;border-bottom:0;border-top:3px solid transparent;white-space:normal;line-height:1.15;text-align:center}
  .tab[aria-selected=true]{border-top-color:var(--gold);color:var(--gold)}
  .tab .ico{display:block}
  .tab .lbl-d{display:none} .tab .lbl-m{display:inline}
  .tab .ct{display:none}
  .tab.desk{display:none}
  .tab.mob{display:flex}
  .lede{font-size:19px}
  .bar-row{grid-template-columns:minmax(0,1fr) 84px;gap:2px 10px;padding:5px 6px}
  .bar-row .nm{grid-column:1/-1;white-space:normal}
  .bar-row .w{display:none}
  .filter{min-width:0;flex:1}
  .toast{bottom:84px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.alu{transition:width .5s ease-out}}
@media print{
  html,body{background:#fff}
  .top,.tabs,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .panel{border:0}
  th{position:static}
}
</style>

function makeClient() {

async function q(table, order) {
  let qq = SB.from(table).select('*');
  if (order) qq = qq.order(order, { ascending: true });
  const { data, error } = await qq;
  if (error) throw error;
  return data || [];
}
async function rpc(fn, args) { const { data, error } = await SB.rpc(fn, args || {}); if (error) throw error; return data; }
async function callFn(name, body) {
  const { data, error } = await SB.functions.invoke(name, { body });
  if (error) { let msg = error.message; try { const b = await error.context.json(); if (b && b.error) msg = b.error; } catch (_) {} throw new Error(msg); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function loadRaw() {
  if (SNAP) return SNAP;
  const master = ME.role === 'master';
  const base = ['alu_profiles', 'packing_lists', 'bundles', 'bundle_notes', 'stock_adjustments', 'sales_orders', 'sales_order_lines', 'work_orders', 'work_order_lines', 'status_history', 'consumables', 'app_users'];
  const extra = master ? ['lots', 'expenses', 'consumable_txns', 'purchase_orders', 'purchase_order_lines'] : [];
  const names = [...base, ...extra];
  const rows = await Promise.all(names.map(n => q(n)));
  const R = Object.fromEntries(names.map((n, i) => [n, rows[i]]));
  if (!master) R.consumable_stock = await rpc('consumable_stock');
  return R;
}

/* ------------------------------ model ------------------------------ */
function buildModel(R) {
  const master = isMaster();
  const A = k => R[k] || [];
  const lineSort = (a, b) => (a.line_no || 0) - (b.line_no || 0);
  const bundlesBy = groupBy(A('bundles'), 'packing_list');
  const prof = {};
  A('alu_profiles').slice().sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999)).forEach((p, i) => prof[p.name] = { name: p.name, series: p.series || 'Other', aliases: p.aliases || [], isNew: !!p.is_new, reorder: p.reorder_pcs, order: i, inPcs: 0, inKg: 0, outPcs: 0, outKg: 0, cost: 0, avgs: [], last: '', bundles: [] });
  const ensure = name => prof[name] || (prof[name] = { name, series: 'Other', aliases: [], order: 999, inPcs: 0, inKg: 0, outPcs: 0, outKg: 0, cost: 0, avgs: [], last: '', bundles: [] });
  const lotKg = {};
  A('packing_lists').filter(l => l.direction === 'in' && l.lot).forEach(l => lotKg[l.lot] = (lotKg[l.lot] || 0) + sum(bundlesBy[l.id] || [], b => b.kg));
  const lots = A('lots').map(l => {
    const extra = sum(A('expenses').filter(e => e.lot === l.id), e => e.amount); const kg = lotKg[l.id] || 0;
    const pcs = sum(A('packing_lists').filter(p => p.lot === l.id).flatMap(p => bundlesBy[p.id] || []), b => b.pcs);
    const total = (+l.material_cost || 0) + extra;
    return { ...l, material_cost: +l.material_cost || 0, extra, kg, pcs, total, rate: kg ? total / kg : 0 };
  });
  const lotById = Object.fromEntries(lots.map(l => [l.id, l]));
  const notes = A('bundle_notes');
  const lists = A('packing_lists').map(l => {
    const raw = (bundlesBy[l.id] || []).slice().sort((a, b) => a.no - b.no).map(b => ({ ...b, pcs: +b.pcs, kg: +b.kg, len_ft: +b.len_ft }));
    const byP = {}; raw.forEach(b => (byP[b.profile] = byP[b.profile] || []).push(b.kg / (b.pcs || 1)));
    const typical = {}; Object.entries(byP).forEach(([k, v]) => typical[k] = median(v));
    const bundles = raw.map(b => { const avg = b.pcs ? b.kg / b.pcs : 0; const tp = typical[b.profile] || avg; const dev = tp ? (avg / tp - 1) * 100 : 0;
      const nt = notes.find(n => n.packing_list === l.id && n.bundle === b.no);
      return { ...b, list: l.id, direction: l.direction, party: l.party, date: l.received || l.date, avg, dev, flag: Math.abs(dev) >= 8, note: nt ? nt.text : '' }; });
    return { ...l, bundles, pcs: sum(bundles, b => b.pcs), kg: sum(bundles, b => b.kg), lotObj: lotById[l.lot] };
  });
  lists.forEach(l => l.bundles.forEach(b => {
    const p = ensure(b.profile); p.bundles.push(b);
    if (l.direction === 'in') { p.inPcs += b.pcs; p.inKg += b.kg; p.cost += b.kg * (l.lotObj ? l.lotObj.rate : 0); p.avgs.push(b.avg); if ((l.received || l.date) > p.last) p.last = l.received || l.date; }
    else { p.outPcs += b.pcs; p.outKg += b.kg; }
  }));
  A('stock_adjustments').forEach(a => { const p = ensure(a.profile); p.inPcs += +a.pcs || 0; p.inKg += +a.kg || 0; });
  const profiles = Object.values(prof).map(p => { const rate = p.inKg ? p.cost / p.inKg : 0; const pcs = p.inPcs - p.outPcs, kg = p.inKg - p.outKg;
    return { ...p, pcs, kg, rate: master ? rate : 0, value: master ? kg * rate : 0, avg: pcs > 0 ? kg / pcs : (p.inPcs ? p.inKg / p.inPcs : 0), lo: p.avgs.length ? Math.min(...p.avgs) : 0, hi: p.avgs.length ? Math.max(...p.avgs) : 0 }; })
    .sort((a, b) => a.order - b.order);
  const P = Object.fromEntries(profiles.map(p => [p.name, p]));
  const seriesOrder = []; profiles.forEach(p => { if (!seriesOrder.includes(p.series)) seriesOrder.push(p.series); });

  // orders
  const histBy = groupBy(A('status_history').map(h => ({ ...h, key: h.entity + ':' + h.entity_id })), 'key');
  const soLines = groupBy(A('sales_order_lines'), 'sales_order'), woLines = groupBy(A('work_order_lines'), 'work_order');
  const work = A('work_orders').map(w => ({ ...w, lines: (woLines[w.id] || []).slice().sort(lineSort), history: (histBy['work_order:' + w.id] || []).slice().sort((a, b) => String(b.changed_at).localeCompare(a.changed_at)) }));
  const sales = A('sales_orders').map(s => ({ ...s, lines: (soLines[s.id] || []).slice().sort(lineSort), history: (histBy['sales_order:' + s.id] || []).slice().sort((a, b) => String(b.changed_at).localeCompare(a.changed_at)), work: work.filter(w => w.sales_order === s.id) }));
  work.forEach(w => { w.so = sales.find(s => s.id === w.sales_order) || null; });

  // consumables
  const txs = A('consumable_txns').map(x => ({ ...x, qty: +x.qty, rate: x.rate == null ? null : +x.rate }));
  const txBy = groupBy(txs, 'consumable');
  const rpcQty = R.consumable_stock ? Object.fromEntries(R.consumable_stock.map(x => [x.id, +x.qty])) : null;
  const month = today().slice(0, 7);
  const cons = A('consumables').filter(c => c.active !== false).map(c => {
    const tx = (txBy[c.id] || []).slice().sort((a, b) => String(b.date).localeCompare(a.date));
    const qty = rpcQty ? (rpcQty[c.id] || 0) : sum(tx, x => x.kind === 'usage' ? -x.qty : x.qty);
    const buys = tx.filter(x => (x.kind === 'purchase' || x.kind === 'opening') && x.rate != null);
    const bq = sum(buys, x => x.qty); const avg = bq ? sum(buys, x => x.qty * x.rate) / bq : 0;
    const usedMonth = sum(tx.filter(x => x.kind === 'usage' && String(x.date).startsWith(month)), x => x.qty);
    return { ...c, reorder_level: c.reorder_level == null ? null : +c.reorder_level, qty, avg, value: qty * avg, tx, usedMonth, low: c.reorder_level != null && qty <= +c.reorder_level };
  });
  const consById = Object.fromEntries(cons.map(c => [c.id, c]));
  const expenses = A('expenses').map(e => ({ ...e, amount: +e.amount }));

  // profit per order (master only)
  if (master) sales.forEach(s => {
    const flags = new Set(); let rev = 0, mat = 0;
    const lines = s.lines.map(l => {
      const p = P[l.profile]; const per = p && p.inPcs ? p.inKg / p.inPcs : 0;
      let kg = l.kg != null ? +l.kg : null, est = false;
      if (kg == null && l.pcs && per) { kg = l.pcs * per; est = true; flags.add('f_est_kg'); }
      if (kg == null && (l.rate_unit || 'kg') === 'kg') flags.add('f_no_kg');
      const revenue = (l.rate_unit === 'pc' ? (l.pcs || 0) : (kg || 0)) * (+l.rate || 0);
      const matRate = s.material_by === 'party' ? 0 : (p && p.rate) || 0;
      if (s.material_by !== 'party' && !matRate) flags.add('f_no_mat_rate');
      const material = (kg || 0) * matRate; rev += revenue; mat += material;
      return { ...l, kgCalc: kg, est, revenue, matRate, material };
    });
    const woIds = new Set(s.work.map(w => w.id));
    const used = txs.filter(x => x.kind === 'usage' && (x.sales_order === s.id || woIds.has(x.work_order))).map(x => ({ ...x, item: consById[x.consumable], cost: x.qty * ((consById[x.consumable] || {}).avg || 0) }));
    if (!used.length) flags.add('f_no_cons');
    const exps = expenses.filter(e => e.sales_order === s.id || woIds.has(e.work_order));
    const consCost = sum(used, x => x.cost), expCost = sum(exps, e => e.amount);
    const profit = rev - mat - consCost - expCost;
    const complete = !flags.has('f_no_kg') && !flags.has('f_no_mat_rate');
    s.pnl = { lines, rev, mat, used, consCost, exps, expCost, cost: mat + consCost + expCost, profit, margin: rev ? profit / rev * 100 : null, flags: [...flags], complete };
  });
  const pos = A('purchase_orders').map(o => ({ ...o, lines: A('purchase_order_lines').filter(l => l.purchase_order === o.id) }));
  const users = A('app_users');
  return { profiles, P, lots, lotById, lists, seriesOrder, bundles: lists.flatMap(l => l.bundles), notes, sales, work, cons, consById, txs, expenses, pos, users,
    stockKg: sum(profiles, p => p.kg), stockPcs: sum(profiles, p => p.pcs), stockVal: sum(profiles, p => p.value), inStock: profiles.filter(p => p.pcs > 0 || p.kg > 0.001) };
}

/* toast */
let toastT;
function toast(msg, kind, undo) {
  document.querySelectorAll('.toast').forEach(x => x.remove()); clearTimeout(toastT);
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.setAttribute('role', 'status');

/* ------------------------------ table helper ------------------------------ */
function table(el, cfg) {
  const st = { k: cfg.sort || null, dir: cfg.dir || 1, open: cfg.open || null };
  const draw = () => {
    let rows = cfg.rows.slice();
    if (cfg.filter) rows = rows.filter(cfg.filter);
    if (st.k) { const c = cfg.cols.find(c => c.k === st.k); const g = (c && c.sv) || (r => r[st.k]); rows.sort((a, b) => { const x = g(a), y = g(b); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'en', {numeric: true})) * st.dir; }); }
    const cols = cfg.cols.filter(c => !c.hide);
    const cell = (c, r) => c.h ? c.h(r) : esc(c.v ? c.v(r) : r[c.k]);
    const foot = cfg.foot ? `<tfoot><tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${cfg.foot(c, rows) ?? ''}</td>`).join('')}</tr></tfoot>` : '';
    el.innerHTML = rows.length ? `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''} ${c.nosort ? '' : 'sortable'}" data-k="${c.k}">${esc(c.t)}${st.k === c.k ? (st.dir > 0 ? ' ▴' : ' ▾') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => { const id = cfg.id ? cfg.id(r) : i; const isOpen = cfg.detail && String(st.open) === String(id);
        return `<tr class="${cfg.detail || cfg.onRow ? 'click' : ''} ${isOpen ? 'open' : ''} ${cfg.hl && cfg.hl(r) ? 'hl' : ''}" data-i="${i}" data-id="${esc(id)}">${cols.map(c => `<td class="${c.num ? 'num' : ''}">${cell(c, r)}</td>`).join('')}</tr>` +
          (isOpen ? `<tr class="detail"><td colspan="${cols.length}">${cfg.detail(r)}</td></tr>` : ''); }).join('')}</tbody>${foot}</table></div>`
      : (cfg.empty || `<p class="sub" style="padding:16px">${esc(t('no_match'))}</p>`);
    el._rows = rows; if (cfg.after) cfg.after(el);
  };
  el.onclick = e => {
    const th = e.target.closest('th.sortable'); if (th) { const k = th.dataset.k; if (st.k === k) st.dir *= -1; else { st.k = k; st.dir = 1; } draw(); return; }
    if (e.target.closest('.detail') || e.target.closest('button,a,[data-go],select,input')) return;
    const tr = e.target.closest('tbody tr[data-i]'); if (!tr) return;
    const r = el._rows[+tr.dataset.i];
    if (cfg.detail) { const id = tr.dataset.id; st.open = String(st.open) === id ? null : id; draw(); }
    else if (cfg.onRow) cfg.onRow(r);
  };
  draw();
  return { draw, st };
}
/* cards for phones: same data, one card per row, tap to expand */
function cards(el, cfg) {
  const st = { open: cfg.open || null };
  const draw = () => {
    let rows = cfg.rows.slice(); if (cfg.filter) rows = rows.filter(cfg.filter); if (cfg.order) rows.sort(cfg.order);
    el.innerHTML = rows.length ? `<div class="cards">${rows.map(r => { const id = cfg.id(r); const isOpen = String(st.open) === String(id);
      return `<article class="card" data-id="${esc(id)}">${cfg.card(r)}<div class="c-more"><button class="link" data-toggle="${esc(id)}" type="button">${isOpen ? '▴' : '▾'} ${esc(t('history'))} · ${esc(t('items'))}</button></div>${isOpen ? `<div class="c-detail">${cfg.detail(r)}</div>` : ''}</article>`; }).join('')}</div>`
      : (cfg.empty || `<p class="sub">${esc(t('no_match'))}</p>`);
    if (cfg.after) cfg.after(el);
  };
  el.onclick = e => { const b = e.target.closest('[data-toggle]'); if (b) { st.open = String(st.open) === b.dataset.toggle ? null : b.dataset.toggle; draw(); } };
  draw(); return { draw, st };
}

function soActions(o) {

  if (o.status === 'confirmed') return `<div class="acts no-print"><button class="bigbtn ghost" data-so="${esc(o.id)}" data-to="received" data-from="confirmed" type="button">${esc(t('do_unconfirm'))}</button></div>`;

function woSteps(w) {
  const i = WO_FLOW.indexOf(w.stage);
  return `<div class="steps">${WO_FLOW.map((s, j) => `<span class="step ${j < i ? 'done' : j === i ? 'cur' : ''}"><i></i>${esc(sgLabel(s))}</span>`).join('')}</div>`;
}
function woActions(w, mode = 'both') {
  if (!ONLINE) return '';
  const i = WO_FLOW.indexOf(w.stage), next = WO_FLOW[i + 1], prev = WO_FLOW[i - 1];
  const canNext = next && (isMaster() || i + 1 <= 3);
  const canBack = prev && (isMaster() || i <= 3);
  if (!canNext && !canBack) return '';
  const showNext = canNext && mode !== 'back', showBack = canBack && mode !== 'next';
  if (!showNext && !showBack) return '';
  return `<div class="acts no-print">${showNext ? `<button class="bigbtn" data-wo="${esc(w.id)}" data-to="${next}" data-from="${w.stage}" type="button">${esc(t('do_' + next))}</button>` : ''}${showBack ? `<button class="bigbtn ghost" data-wo="${esc(w.id)}" data-to="${prev}" data-from="${w.stage}" type="button">${esc(t('do_back'))}</button>` : ''}</div>`;
}
async function changeStatus(kind, id, to, from, btn) {
  if (btn) btn.disabled = true;
  try {
    if (kind === 'so') await rpc('set_sales_order_status', { p_id: id, p_status: to });
    else await rpc('set_work_order_stage', { p_id: id, p_stage: to });
  } catch (e) { if (btn) btn.disabled = false; toast(t('err', { msg: e.message || e }), 'err'); return; }
  // keep the order open if its details were showing
  const v = location.hash.replace(/^#/, '').split('/')[0];
  if (btn && btn.closest('.detail,.c-detail') && (v === 'sales' || v === 'work')) history.replaceState(null, '', '#' + v + '/' + id);
  await reload(true);
  const undo = from ? () => changeStatus(kind, id, from, null) : null;
  toast(t('done_to', { id, st: kind === 'so' ? stLabel(to) : sgLabel(to) }), 'ok', undo);
}

/* orders */
function orderLines(o, withStock) {
  if (!o.lines.length) return `<p class="muted">${esc(t('no_lines'))}</p>`;
  return `<div class="tw"><table class="compact"><thead><tr><th>${esc(t('profile'))}</th><th>${esc(t('finish'))}</th><th class="num">${esc(t('pcs'))}</th>${withStock ? `<th class="num">${esc(t('in_stock_now'))}</th>` : ''}<th class="num">${esc(t('kg'))}</th>${o.lines.some(l => l.rate != null) ? `<th class="num">${esc(t('rate'))}</th>` : ''}</tr></thead><tbody>${o.lines.map(l => {
    const p = M.P[l.profile], have = p ? p.pcs : 0, short = l.pcs && have < l.pcs;
    return `<tr><td><button class="link" data-go="stock/${esc(l.profile)}">${esc(l.profile)}</button></td><td>${esc(l.finish || '')}</td><td class="num">${l.pcs ? n0(l.pcs) : ''}</td>${withStock ? `<td class="num">${n0(have)}${short ? ` <span class="pill warn">${esc(t('short', { n: n0(l.pcs - have) }))}</span>` : ''}</td>` : ''}<td class="num">${l.kg != null ? n2(l.kg) : ''}</td>${o.lines.some(x => x.rate != null) ? `<td class="num">${l.rate != null ? '₹' + n2(l.rate) + ' / ' + esc(l.rate_unit === 'pc' ? 'pc' : 'kg') : ''}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}
function soDetail(o, inCard) {
  const facts = [[t('phone'), o.phone ? `<a class="link" href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ''], [t('taken_by'), esc(o.taken_by || '')], [t('due'), dt(o.due) + ' ' + (openSO(o) ? dueBadge(o.due) : '')], [t('material_from'), esc(t(o.material_by === 'party' ? 'mat_party' : 'mat_acta'))],
    [t('linked'), o.work.map(w => `<button class="link" data-go="work/${esc(w.id)}">${esc(w.id)}</button> ${sgPill(w.stage)}`).join('<br>')]].filter(f => f[1] && String(f[1]).trim());
  return `<div class="grid2 wide"><div>${inCard ? '' : soActions(o)}${orderLines(o, openSO(o))}</div><div><dl class="kv" style="margin:0 0 12px">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>${o.notes ? `<p class="note">${esc(o.notes)}</p>` : ''}<h3 style="margin-top:12px">${esc(t('history'))}</h3>${histList(o.history)}</div></div>`;
}
function woDetail(w, inCard) {
  const facts = [[t('process'), esc(procLabel(w.process))], [t('shade'), esc(w.shade || '')], [t('due'), dt(w.due) + ' ' + (openWO(w) ? dueBadge(w.due) : '')], [t('for_order'), w.sales_order ? `<button class="link" data-go="sales/${esc(w.sales_order)}">${esc(w.sales_order)}</button>` : ''], [t('party'), esc(w.party || '')]].filter(f => f[1] && String(f[1]).trim());
  return `<div class="grid2 wide"><div>${woSteps(w)}${woActions(w, inCard ? 'back' : 'both')}${orderLines({ lines: w.lines }, openWO(w))}</div><div><dl class="kv" style="margin:0 0 12px">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>${w.notes ? `<p class="note">${esc(w.notes)}</p>` : ''}<h3 style="margin-top:12px">${esc(t('history'))}</h3>${histList(w.history)}</div></div>`;

/* ------------------------------ search ------------------------------ */
function renderSearch(text) {
  drawTabs('');
  const master = isMaster();
  const toks = text.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = s => { s = String(s).toLowerCase(); return toks.every(tk => s.includes(tk)); };
  const mk = s => { let out = esc(s); toks.forEach(tk => { if (tk.length < 2 && !/^\d$/.test(tk)) return; const re = new RegExp('(' + tk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); out = out.replace(re, '<mark>$1</mark>'); }); return out; };
  const groups = [
    ['g_orders', M.sales.filter(o => hit([o.id, o.party, o.phone, o.taken_by, stLabel(o.status), ...o.lines.map(l => l.profile)].join(' '))).map(o => ({ t: `${o.id} — ${o.party}`, d: `${stLabel(o.status)} · ${t('due')} ${dt(o.due)} · ${itemsTxt(o)}`, r: n0(sum(o.lines, l => l.pcs)) + ' ' + t('pcs'), go: 'sales/' + o.id }))],
    ['g_work', M.work.filter(w => hit([w.id, w.party, w.process, procLabel(w.process), w.shade, sgLabel(w.stage), w.sales_order, ...w.lines.map(l => l.profile)].join(' '))).map(w => ({ t: `${w.id} — ${procLabel(w.process)}${w.shade ? ', ' + w.shade : ''}`, d: `${w.party || ''} · ${sgLabel(w.stage)} · ${itemsTxt(w)}`, r: dt(w.due), go: 'work/' + w.id }))],
    ['g_profiles', M.profiles.filter(p => hit(`${p.name} ${p.series} ${p.aliases.join(' ')}`)).map(p => ({ t: p.name, d: `${p.series}${p.aliases.length ? ' — ' + p.aliases.join(', ') : ''}`, r: p.kg ? `${n2(p.kg)} kg` : t('no_stock'), go: 'stock/' + p.name }))],
    ['g_bundles', M.bundles.filter(b => hit(`#${b.no} bundle ${b.no} ${b.profile} ${b.supplier_name} ${b.pcs} pcs ${n2(b.kg)} kg ${b.kg} ${b.party} ${b.list} ${b.note}`)).map(b => ({ t: `${t('bundle')} #${b.no} — ${b.profile}`, d: `${b.party}, ${b.list}, ${b.pcs} ${t('pcs')}, ${n3(b.avg)} kg${b.note ? ' — ' + b.note : ''}`, r: `${n2(b.kg)} kg`, go: `lists/${b.list}/${b.no}` }))],
    ['g_lists', M.lists.filter(l => hit(`${l.id} ${l.party} ${l.date} ${dt(l.date)} ${l.lot || ''}`)).map(l => ({ t: `${l.id} — ${l.party}`, d: `${t(l.direction === 'in' ? 'rcv' : 'sent')} ${dt(l.received || l.date)}, ${l.bundles.length} ${t('bundles')}`, r: `${n2(l.kg)} kg`, go: 'lists/' + l.id }))],
    ['g_cons', M.cons.filter(c => hit(`${c.name} ${c.category} ${t('c_' + c.category)} ${c.shade || ''}`)).map(c => ({ t: c.name, d: t('c_' + c.category), r: `${nq(c.qty)} ${c.unit}`, go: 'cons/' + c.id }))],
    ...(master ? [
      ['g_lots', M.lots.filter(l => hit(`${l.id} ${l.supplier} ${l.received} ${dt(l.received)} ${l.material_cost} ${n0(l.material_cost)}`)).map(l => ({ t: `${l.id} — ${l.supplier}`, d: `${dt(l.received)}, ₹${n2(l.rate)} / kg`, r: inr(l.total), go: 'purchases' }))],
      ['g_exp', M.expenses.filter(e => hit(`${e.category} ${e.description} ${e.party || ''} ${e.amount} ${n0(e.amount)} ${dt(e.date)} ${e.sales_order || ''} ${e.work_order || ''}`)).map(e => ({ t: e.description || e.category, d: `${e.category}, ${dt(e.date)}`, r: inr(e.amount), go: 'expenses/' + e.id }))]] : [])
  ].filter(g => g[1].length);
  const total = sum(groups, g => g[1].length);
  $('#view').innerHTML = `<div class="head-row"><div><h2>${esc(total ? (total === 1 ? t('result1', { q: text }) : t('results', { n: total, q: text })) : t('nothing_for', { q: text }))}</h2><p class="sub" style="margin:0">${esc(total ? t('res_hint') : t('res_try'))}</p></div></div>
    ${groups.map(([g, rs]) => `<div class="res-group"><h3>${esc(t(g))}<span>${rs.length}</span></h3><div class="panel">${rs.slice(0, 60).map(r => `<div class="res" data-go="${esc(r.go)}"><span class="t">${mk(r.t)}</span><span class="d">${mk(r.d)}</span><span class="r">${esc(r.r)}</span></div>`).join('')}${rs.length > 60 ? `<p class="sub" style="padding:10px 14px;margin:0">${esc(t('more_n', { n: rs.length - 60 }))}</p>` : ''}</div></div>`).join('')}`;
}
document.addEventListener('click', e => { if (e.target.closest('.res')) $('#q').value = ''; }, true);

/* ------------------------------ login + boot ------------------------------ */
function showLogin(message, prefill) {
  document.body.classList.add('locked');
  document.body.insertAdjacentHTML('afterbegin', `<div class="lock" id="lock"><img class="badge" src="${LOGO}" alt="NKB Aluminium" width="132" height="132"><form id="lockf" autocomplete="on">
    <div class="head"><div><h1>${esc(t('app'))}</h1><p class="firm">${esc(COMPANY)}</p></div><span class="seg"><button type="button" data-lang="en" aria-pressed="${LANG === 'en'}">EN</button><button type="button" data-lang="hi" aria-pressed="${LANG === 'hi'}">हिं</button></span></div>
    <label class="f" for="lid">${esc(t('login_id'))}</label><input id="lid" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(prefill || '')}">
    <label class="f" for="pw">${esc(t('password'))}</label><input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="keep"><input type="checkbox" id="keep" ${store.get('acta.keep') !== '0' ? 'checked' : ''}> ${esc(t('keep'))}</label>
    <button id="go" type="submit">${esc(t('signin'))}</button>
    <p class="err" id="err" role="alert">${esc(message || '')}</p></form></div>`);
  const id = $('#lid'), pw = $('#pw'), btn = $('#go'), err = $('#err');
  (prefill ? pw : id).focus();
  $('#lockf').onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = t('signing');
    store.set('acta.keep', $('#keep').checked ? '1' : '0'); makeClient();
    const login = id.value.trim().toLowerCase();
    const email = login.includes('@') ? login : `${login}@acta.local`;
    let res;
    try { res = await SB.auth.signInWithPassword({ email, password: pw.value }); } catch (ex) { res = { error: ex }; }
    if (res.error) { btn.disabled = false; btn.textContent = t('signin'); const m = String(res.error.message || ''); err.textContent = /invalid|credential/i.test(m) ? t('bad_login') : /banned/i.test(m) ? t('off_login') : /fetch|network/i.test(m) ? t('net_err') : t('err', { msg: m }); pw.select(); return; }
    const ok = await afterSignIn(res.data.user);
    if (!ok) { btn.disabled = false; btn.textContent = t('signin'); }
  };
}
async function afterSignIn(user) {
  try {
    const rows = await q('app_users');
    ME = rows.find(r => r.id === user.id) || null;
  } catch (e) { ME = null; }
  if (!ME || !ME.active) { try { await SB.auth.signOut(); } catch (_) {} const lk = document.getElementById('lock'); if (lk) lk.remove(); showLogin(t('off_login')); return false; }
  if (!store.get('acta.lang') && ME.lang) LANG = ME.lang;
  const lk = document.getElementById('lock'); if (lk) lk.remove();
  document.body.classList.remove('locked');
  await reload(false); route();
  return true;
}
async function reload(rerender) {
  try { RAW = await loadRaw(); M = buildModel(RAW); LOADED_AT = new Date(); }
  catch (e) { if (!M) { $('#view').innerHTML = `<div class="panel empty"><p>${esc(t('load_err', { msg: e.message || e }))}</p></div>`; } else toast(t('load_err', { msg: e.message || e }), 'err'); return; }
  drawHeader(); if (rerender) { if ($('#q').value.trim()) renderSearch($('#q').value.trim()); else route(); }
}
$('#refresh').onclick = () => reload(true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ONLINE && ME && LOADED_AT && Date.now() - LOADED_AT > 60e3) reload(true); });
setInterval(() => { if (document.visibilityState === 'visible' && ONLINE && ME) reload(true); }, 180e3);

(async function boot() {
  drawHeader();
  if (SNAP) { ME = null; M = buildModel(SNAP); route(); return; }
  if (!ONLINE) {
    const msg = CFG.url ? t('net_err') : 'The data file is missing. Keep data.js next to this page, or open nkbapex.in.';
    document.body.classList.add('locked'); document.body.innerHTML = `<div class="lock"><img class="badge" src="${LOGO}" alt="NKB Aluminium" width="132" height="132"><form><h1>${esc(t('app'))}</h1><p class="firm">${esc(msg)}</p></form></div>`; return;
  }
  makeClient();
  let session = null;
  try { const r = await SB.auth.getSession(); session = r.data && r.data.session; } catch (_) {}
  if (session && session.user) {
    document.body.classList.add('locked');
    document.body.insertAdjacentHTML('afterbegin', `<div class="lock" id="lock"><img class="badge" src="${LOGO}" alt="NKB Aluminium" width="132" height="132"><p>${esc(t('loading'))}</p></div>`);
    if (await afterSignIn(session.user)) return;
    return;
  }
  showLogin();
})();
</script>
</body>
</html>
