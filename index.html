<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
:root{
  --black:#000000; --mill:#EDEEEF; --sheet:#FFFFFF; --ink:#141414; --steel:#545454; --faint:#6B6B6B;
  --rule:#D5D5D5; --rule2:#E7E7E7; --hover:#F5F6F7; --open:#F7F8F9;
  --gold:#E2C545; --gold-text:#6B5604; --gold-soft:#FAF2D2;
  --silver:linear-gradient(180deg,#F6F6F6 0%,#D2D2D2 38%,#9A9A9A 100%);
  --hd-line:#262626; --hd-text:#F4F4F4; --hd-dim:#ABABAB; --hd-field:#141414; --hd-hover:#111111;
  --warn:#9C3A1A; --warn-soft:#FAE9E2; --ok:#2B6548; --ok-soft:#E3F1E9; --blue:#2A5272; --blue-soft:#E5EEF6;
  --display:"Barlow","Bahnschrift","DIN Alternate","Segoe UI","Nirmala UI","Noto Sans Devanagari",Roboto,sans-serif;
  --text:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,Roboto,"Nirmala UI","Noto Sans Devanagari",Arial,sans-serif;
  /* type scale (rem: the Large text setting raises the root size) */
  --fs-cap:.8125rem; --fs-sm:.875rem; --fs-body:.9375rem; --fs-md:1rem; --fs-h3:1.0625rem; --fs-h2:1.375rem; --fs-lede:1.625rem; --fs-big:1.5rem;
  --side-w:236px; --r:8px;
}
html{font-size:16px;background:var(--mill);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.tl{font-size:18px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 var(--fs-body)/1.5 var(--text);background:var(--mill);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
input[type=checkbox]{accent-color:var(--ink);width:1.05rem;height:1.05rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--steel)} .faint{color:var(--faint)} .tiny{font-size:var(--fs-cap)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell: black side rail on computers, black bottom bar on phones ---------- */
.shell{min-height:100vh}
.rail{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--black);color:var(--hd-text);display:flex;flex-direction:column;z-index:30}
.rail-brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;border-bottom:1px solid var(--hd-line)}
.rail-brand .logo{width:48px;height:48px;flex:none;display:block}
.rail-brand b{display:block;font:600 1.125rem/1.15 var(--display);color:#fff;letter-spacing:-.1px}
.rail-brand span{display:block;font-size:var(--fs-cap);color:var(--hd-dim);line-height:1.3;margin-top:2px}
.tabs{display:flex;flex-direction:column;gap:2px;padding:10px 10px;overflow-y:auto;flex:1}
.tab{display:flex;align-items:center;gap:12px;min-height:42px;border:0;background:none;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--hd-dim);font-size:var(--fs-body);text-align:left;position:relative;white-space:nowrap}
.tab .ico{width:20px;height:20px;flex:none}
.tab .lbl-d{flex:1;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:#fff;background:var(--hd-hover)}
.tab[aria-selected=true]{color:#fff;background:#161616;font-weight:600}
.tab[aria-selected=true]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.tab[aria-selected=true] .ico{color:var(--gold)}
.tab .ct{font-size:var(--fs-cap);color:#8A8A8A;font-weight:400;font-variant-numeric:tabular-nums}
.tab .lbl-m,.tab.mob{display:none}
.rail-foot{border-top:1px solid var(--hd-line);padding:12px 14px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center;font:600 var(--fs-sm) var(--display);flex:none}
.rail-foot .who{min-width:0;flex:1}
.rail-foot .who b{display:block;color:#fff;font-weight:600;font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-foot .who button{border:0;background:none;padding:0;color:var(--gold);font-size:var(--fs-cap);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.col{margin-left:var(--side-w);min-width:0}

/* top bar (computers): search + tools; (phones): black band with the badge */
.top{position:sticky;top:0;z-index:20;background:rgba(237,238,239,.94);backdrop-filter:saturate(1.4) blur(6px);-webkit-backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:16px}
.mbrand{display:none}
.search{position:relative;display:block;flex:1;max-width:620px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:42px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);padding:0 44px 0 40px;font-size:var(--fs-body)}
.search input::placeholder{color:#7A7A7A}
.search input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(226,197,69,.35)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:var(--fs-cap) var(--text);color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:0 6px;background:var(--mill)}
.tools{display:flex;align-items:center;gap:10px;margin-left:auto}
.fresh{margin:0;color:var(--steel);font-size:var(--fs-cap);text-align:right;line-height:1.3;white-space:nowrap}
.fresh b{font-weight:600;color:var(--ink)}
.newdata{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-text);border-radius:999px;padding:4px 12px;font-size:var(--fs-cap);font-weight:600;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex:none;background:var(--sheet)}
.seg button{border:0;background:var(--sheet);min-height:34px;padding:0 11px;font-size:var(--fs-sm);cursor:pointer;color:var(--steel)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold);font-weight:600}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;height:36px;min-width:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);padding:0 9px;font-size:var(--fs-sm)}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn[aria-pressed=true]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.iconbtn.light{height:36px;min-width:36px;font-size:1.125rem}
.iconbtn.light[disabled]{opacity:.4;cursor:default}
.busy{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite;pointer-events:none}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}

main{max-width:1320px;margin:0 auto;padding:26px 32px 72px}
h2{font:600 var(--fs-h2)/1.2 var(--display);margin:0 0 4px;letter-spacing:-.1px}
h3{font:600 var(--fs-h3)/1.25 var(--display);margin:0 0 8px}
.sub{color:var(--steel);margin:0 0 16px;font-size:var(--fs-sm);line-height:1.45}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.banner{background:var(--blue-soft);color:var(--blue);border-radius:var(--r);padding:10px 14px;margin:0 0 16px;font-size:var(--fs-sm)}

/* ---------- overview ---------- */
.lede{font:500 var(--fs-lede)/1.3 var(--display);margin:0 0 22px;max-width:44ch;letter-spacing:-.2px}
.lede .soft{color:var(--steel)}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.ov.one{grid-template-columns:minmax(0,1fr);max-width:780px}
.rack{padding:20px 22px 12px}
.rack-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.rack-head .sp{flex:1}
.toggle{display:inline-flex;gap:8px;align-items:center;color:var(--steel);font-size:var(--fs-sm);cursor:pointer;user-select:none;min-height:32px}
.series{padding:12px 0 6px;border-top:1px solid var(--rule2)}
.series:first-of-type{border-top:0}
.series-h{display:flex;justify-content:space-between;color:var(--steel);font-size:var(--fs-cap);margin:0 0 6px}
.series-h b{font:600 var(--fs-sm) var(--display);color:var(--ink)}
.bar-row{display:grid;grid-template-columns:230px minmax(0,1fr) 100px 92px;gap:14px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.bar-row:hover{background:var(--hover)}
.bar-row .nm{font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .nm .new{font-size:var(--fs-cap);color:var(--gold-text);margin-left:6px}
.track{height:14px;position:relative}
.alu{height:100%;border-radius:2px 3px 3px 2px;background:var(--silver);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset -3px 0 0 rgba(23,34,43,.18);min-width:3px}
.bar-row.zero .nm{color:var(--faint)}
.bar-row.zero .track{border-bottom:1px dashed var(--rule)}
.bar-row .v{font-variant-numeric:tabular-nums;text-align:right;font-size:var(--fs-sm)}
.bar-row .w{font-variant-numeric:tabular-nums;text-align:right;color:var(--steel);font-size:var(--fs-cap)}
.side section{padding:16px 20px;border-bottom:1px solid var(--rule2)}
.side section:last-child{border-bottom:0}
.flag{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 0;border-top:1px solid var(--rule2);font-size:var(--fs-sm);cursor:pointer}
.flag:first-of-type{border-top:0}
.flag.static{cursor:default}
.flag .b{font:600 var(--fs-cap) var(--display);color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 7px;height:fit-content;white-space:nowrap}
.flag .b.okb{background:var(--ok-soft);color:var(--ok)} .flag .b.greyb{background:var(--rule2);color:var(--steel)}
.flag:hover .t{text-decoration:underline} .flag.static:hover .t{text-decoration:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:var(--fs-sm);margin:0}
.kv dt{color:var(--steel)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right;min-width:0}
.kv .tot{font-weight:600;border-top:1px solid var(--rule2);padding-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles button{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;min-height:64px}
.tiles button:hover{border-color:var(--ink)}
.tiles b{display:block;font:600 var(--fs-big)/1.1 var(--display)}
.tiles span{font-size:var(--fs-cap);color:var(--steel)}

/* ---------- filters, tables ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;min-height:34px;padding:0 14px;cursor:pointer;font-size:var(--fs-sm);color:var(--steel);white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filter{height:38px;border:1px solid var(--rule);border-radius:6px;padding:0 12px;background:var(--sheet);min-width:220px;font-size:var(--fs-body)}
.filter:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.35)}
select.filter{padding-right:8px}
.filter.mini{min-width:0;height:36px;padding:0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th{font:600 var(--fs-cap) var(--text);color:var(--steel);text-align:left;padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet)}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
th.num{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--rule2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
tr.open td{background:var(--open)}
tr.hl td{background:var(--gold-soft)!important}
tfoot td{font-weight:600;border-top:1px solid var(--rule);border-bottom:0}
.detail td{background:#FAFBFC;padding:16px 18px 20px}
table.compact td{white-space:nowrap;padding:8px 12px}
.detail table.compact th{background:#FAFBFC}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:var(--fs-cap);font-weight:600;white-space:nowrap;line-height:1.5}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.in{background:var(--blue-soft);color:var(--blue)} .pill.out{background:var(--gold-soft);color:var(--gold-text)} .pill.grey{background:var(--rule2);color:var(--steel)} .pill.dark{background:var(--ink);color:#fff}
.dev-hi{color:var(--warn);font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.empty{padding:32px 26px;text-align:left}
.empty h3{font-size:var(--fs-h3)}
.empty p{color:var(--steel);max-width:62ch;margin:6px 0 0}
.pad{padding:16px}
/* list rows: the phone form of a table */
.rlist{display:block}
.rrow{padding:12px 14px;border-bottom:1px solid var(--rule2)}
.rrow:last-child{border-bottom:0}
.rrow.click{cursor:pointer}
.rrow.open{background:var(--open)}
.rrow.hl{background:var(--gold-soft)}
.rr-t{font-size:var(--fs-md);line-height:1.35;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rr-t .rr-x{color:var(--faint);font-size:var(--fs-sm);flex:none;margin-top:1px}
.rr-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:8px 0 0}
.rr-kv div{min-width:0}
.rr-kv dt{font-size:var(--fs-cap);color:var(--steel)}
.rr-kv dd{margin:0;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rr-detail{padding:14px;background:#FAFBFC;border-bottom:1px solid var(--rule2)}
.rr-foot{padding:12px 14px;border-top:1px solid var(--rule);background:#FAFAFA}
.rr-foot .rr-kv{margin:0}
.rr-foot dd{font-weight:600}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.grid2.wide{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.head-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.head-row .sp{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:0 16px;cursor:pointer;min-height:38px;font-size:var(--fs-sm);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--gold);font-weight:600}
.btn.primary:hover{background:#262626}
.btn[disabled],.bigbtn[disabled]{opacity:.55;cursor:progress}
.btn.mini{min-height:32px;padding:0 12px;font-size:var(--fs-cap);border-radius:999px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.link.danger{color:var(--warn)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;padding:16px 20px;margin-bottom:18px}
.meta div span{display:block;color:var(--steel);font-size:var(--fs-cap)}
.meta div b{font:600 1.1875rem/1.25 var(--display)}
.note{background:var(--gold-soft);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:var(--fs-sm);color:#4A3C04}
.cat{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:12px;align-items:center;margin:7px 0;font-size:var(--fs-sm)}
.cat .alu{height:12px}
.res-group{margin-bottom:22px}
.res-group h3{display:flex;gap:8px;align-items:baseline}
.res-group h3 span{font:400 var(--fs-cap) var(--text);color:var(--steel)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:11px 14px;border-bottom:1px solid var(--rule2);cursor:pointer;background:var(--sheet)}
.res:last-child{border-bottom:0}
.res:hover{background:var(--hover)}
.res .t{font-weight:600} .res .d{color:var(--steel);font-size:var(--fs-cap);grid-column:1} .res .r{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
mark{background:#F6DFB8;color:inherit;border-radius:2px;padding:0 1px}

/* ---------- stage stepper, actions ---------- */
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.step{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);color:var(--faint)}
.step i{width:10px;height:10px;border-radius:50%;border:2px solid var(--rule);display:inline-block}
.step.done{color:var(--steel)} .step.done i{background:var(--gold);border-color:#B89A22}
.step.cur{color:var(--ink);font-weight:600} .step.cur i{background:var(--sheet);border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.step+.step::before{content:"";width:18px;height:2px;background:var(--rule);display:inline-block;margin-right:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.bigbtn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--black);background:var(--black);color:var(--gold);font:600 var(--fs-body) var(--display);cursor:pointer}
.bigbtn:hover{background:#262626}
.bigbtn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule);font-weight:500}
.bigbtn.ghost:hover{border-color:var(--ink)}
.hist{list-style:none;margin:0;padding:0;font-size:var(--fs-cap);color:var(--steel)}
.hist li{padding:5px 0;border-top:1px solid var(--rule2)}
.hist li:first-child{border-top:0}

/* ---------- cards (orders and work orders on phones) ---------- */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 15px;min-width:0}
.card .c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .c-id{font:600 var(--fs-md) var(--display)}
.card .c-party{font-weight:600;margin:2px 0 0}
.card .c-meta{color:var(--steel);font-size:var(--fs-sm);margin:2px 0 0}
.card .c-items{font-size:var(--fs-sm);margin:8px 0 0}
.card .c-more{margin-top:10px}
.card .c-more .link{min-height:32px}
.card .c-detail{margin-top:12px;border-top:1px solid var(--rule2);padding-top:12px}
.card .acts{margin:10px 0 0}
.card .acts .bigbtn{flex:1}

/* ---------- forms ---------- */
.form{display:grid;gap:12px;max-width:460px}
.form label{display:grid;gap:5px;font-size:var(--fs-sm);color:var(--steel)}
.form input:not([type=checkbox]):not([type=radio]),.form select{height:44px;border:1px solid var(--rule);border-radius:6px;padding:0 12px;font-size:var(--fs-md);background:var(--sheet);color:var(--ink);width:100%;min-width:0}
.form input:focus,.form select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.form .row{display:flex;gap:8px}
.form .row input{flex:1;min-width:0}
.form.wide{max-width:none}
.msg{font-size:var(--fs-sm);margin:0;min-height:1.2em}
.msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}
.creds{background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;font-size:var(--fs-sm)}
.creds code{font:600 var(--fs-body) ui-monospace,Consolas,monospace;background:var(--sheet);padding:1px 6px;border-radius:4px}
.menu-list{display:grid;gap:8px}
.menu-list button{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-size:var(--fs-md);cursor:pointer;text-align:left}
.menu-list button .ico{width:20px;height:20px;color:var(--steel)}
.menu-list button span:nth-child(2){flex:1}
.cell{width:100px;height:38px;border:1px solid var(--rule);border-radius:6px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.cell:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(226,197,69,.45)}

/* ---------- login ---------- */
body.locked .shell{display:none}
body.locked{background:var(--black)}
.lock{min-height:100vh;display:grid;place-items:center;align-content:center;gap:18px;padding:24px 16px;background:var(--black);color:var(--hd-dim)}
.lock .badge{width:132px;height:132px;display:block;margin:0 auto}
.lock form{width:100%;max-width:400px;background:var(--sheet);color:var(--ink);border-radius:12px;padding:24px 24px 20px}
.lock h1{font:600 1.625rem/1.15 var(--display);margin:0;letter-spacing:-.2px}
.lock .firm{margin:4px 0 16px;color:var(--steel);font-size:var(--fs-sm)}
.lock .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lock label.f{display:block;font-size:var(--fs-sm);color:var(--steel);margin:14px 0 6px}
.lock .pwbox{position:relative}
.lock input[type=text],.lock input[type=password]{width:100%;height:48px;border:1px solid var(--rule);border-radius:6px;padding:0 12px;font-size:1rem;background:var(--mill)}
.lock .pwbox input{padding-right:64px}
.lock .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-size:var(--fs-sm);padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lock input:focus{outline:none;border-color:var(--ink);background:var(--sheet);box-shadow:0 0 0 3px rgba(226,197,69,.45)}
.lock .caps{color:var(--warn);font-size:var(--fs-cap);margin:6px 0 0}
.lock .keep{display:flex;gap:10px;align-items:center;margin:16px 0 18px;font-size:var(--fs-sm);color:var(--steel);cursor:pointer}
.lock button[type=submit]{width:100%;height:48px;border:0;border-radius:6px;background:var(--black);color:var(--gold);font:600 1rem var(--display);cursor:pointer}
.lock button[type=submit][disabled]{opacity:.65;cursor:progress}
.lock .err{color:var(--warn);font-size:var(--fs-sm);margin:10px 0 0;min-height:1.3em}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:var(--r);padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-size:var(--fs-body);z-index:50;box-shadow:0 6px 24px rgba(23,34,43,.25);max-width:calc(100vw - 32px)}
.toast.err{background:var(--warn)}
.toast button{border:0;background:none;color:var(--gold);font-weight:600;cursor:pointer;padding:6px;font-size:var(--fs-body)}
@media (min-width:1024px){.toast{left:calc(50% + var(--side-w) / 2)}}

/* ---------- access checklist ---------- */
.perms{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;background:#FAFAFA}
.perms .pm-h{margin:0 0 10px;font-size:var(--fs-sm);color:var(--steel);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pm-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.perms fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;align-content:start}
.perms legend{font:600 var(--fs-sm) var(--display);color:var(--ink);margin-bottom:6px;padding:0}
.form .pm,.pm{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm);color:var(--ink);cursor:pointer;line-height:1.35}
.pm input{margin-top:2px;flex:none;width:1.05rem;height:1.05rem}

/* ---------- attendance, targets, activity, salary ---------- */
.checkin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;margin:0 0 18px;border-left:4px solid var(--gold)}
.checkin h3{margin:0;font-size:1.125rem}.checkin .sub{margin:2px 0 0}.checkin .pill{align-self:flex-start}
.checkin .bigbtn{min-height:56px;font-size:1.0625rem;padding:0 28px}
.nw{white-space:nowrap}
table.att th,table.att td{padding:7px 5px;font-size:var(--fs-cap)} table.att .sun{background:#F4F4F2}
.goal{display:block;height:14px;background:var(--rule2);border-radius:3px;overflow:hidden}
.goal i{display:block;height:100%;background:linear-gradient(180deg,#F3DE7C 0%,#E2C545 50%,#B8981F 100%);border-radius:3px}
.mnav{display:inline-flex;align-items:center;gap:8px}
.row-i{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.act-day{padding:10px 16px 6px;font:600 var(--fs-sm) var(--display);background:#FAFAFA;border-bottom:1px solid var(--rule2)}
.act{display:grid;grid-template-columns:56px 170px minmax(0,1fr);gap:10px;padding:8px 16px;border-bottom:1px solid var(--rule2);font-size:var(--fs-sm)}
.act .tm{color:var(--steel);font-variant-numeric:tabular-nums}.act .who{font-weight:600}
.att-strip{padding:14px 18px;margin:0 0 18px;border-left:4px solid var(--gold)}
.att-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.att-head h3{margin:0}
.att-chips{display:flex;flex-wrap:wrap;gap:8px}
.ach{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:4px 5px 4px 12px;font-size:var(--fs-sm);background:var(--sheet);min-height:40px}
.ach.on{background:var(--ok-soft);border-color:#BFDCCB;padding-right:12px}
.ledger td{vertical-align:top}
.sal-forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px;align-items:start}
.form.sal-f{max-width:none;border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;background:#FAFAFA;gap:8px}
.form.sal-f h3{margin:0}
.form.sal-f input:not([type=checkbox]){height:42px}
.form.sal-f.inline{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.show-sm{display:none}

/* ---------- tablets and smaller computers ---------- */
@media (max-width:1180px){.sal-forms{grid-template-columns:minmax(0,1fr)}.ov{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:1100px){.ov,.grid2,.grid2.wide{grid-template-columns:minmax(0,1fr)}.ov .side{order:-1}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.fresh{display:none}}

/* ---------- below 1024px: phone shell (black band on top, bar at the bottom) ---------- */
@media (max-width:1023px){
  .rail{inset:auto 0 0 0;width:auto;height:auto;border-top:1px solid var(--hd-line);padding-bottom:env(safe-area-inset-bottom)}
  .rail-brand,.rail-foot{display:none}
  .tabs{flex-direction:row;padding:4px 4px 6px;gap:0;overflow:visible}
  .tab{flex:1 1 0;flex-direction:column;gap:3px;min-height:56px;padding:6px 2px 4px;border-radius:0;justify-content:center;font-size:.8125rem;line-height:1.15;white-space:normal;text-align:center}
  .tab[aria-selected=true]{background:none;color:var(--gold)}
  .tab[aria-selected=true]::before{left:22%;right:22%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .tab .ico{width:22px;height:22px}
  .tab .lbl-d,.tab .ct{display:none}
  .tab .lbl-m{display:inline}
  .tab.desk{display:none}
  .tab.mob{display:flex}
  .col{margin-left:0}
  .top{position:static;background:var(--black);border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .top-in{padding:10px 16px;flex-wrap:wrap;gap:10px}
  .mbrand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .mbrand .logo{width:38px;height:38px;flex:none}
  .mbrand b{font:600 1.125rem/1.1 var(--display);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search{order:5;flex:1 1 100%;max-width:none}
  .search input{background:var(--hd-field);border-color:var(--hd-line);color:#fff;height:44px;font-size:1rem}
  .search input::placeholder{color:#8F8F8F}
  .search svg{color:var(--hd-dim)}
  .search kbd{display:none}
  .tools{gap:8px;margin-left:0}
  .tools .iconbtn,.tools .seg{border-color:var(--hd-line);background:var(--hd-field);color:var(--hd-dim)}
  .tools .seg button{background:var(--hd-field);color:var(--hd-dim);min-height:38px}
  .tools .seg button+button{border-left-color:var(--hd-line)}
  .tools .seg button[aria-pressed=true]{background:var(--gold);color:#000}
  .tools .iconbtn{height:38px;min-width:38px}
  .tools .newdata{background:var(--gold);color:#000;border-color:var(--gold)}
  .tools .tsize,.tools .acct{display:none}
  main{padding:18px 16px 104px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (max-width:1023px) and (min-width:721px){.search{order:0;flex:1 1 auto}.mbrand{flex:none}}

/* ---------- phones ---------- */
@media (max-width:720px){
  body{font-size:1rem}
  html{--fs-body:1rem}
  .lede{font-size:1.25rem;margin-bottom:16px}
  h2{font-size:1.3125rem}
  .bar-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 6px}
  .bar-row .nm{white-space:normal}
  .bar-row .track{grid-column:1/-1;grid-row:2;height:10px}
  .bar-row .w{display:none}
  .rack{padding:16px 14px 8px}
  .filters{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:10px}
  .filters>*{min-width:0;max-width:100%}
  .filters .filter{flex:none;width:100%;height:44px;font-size:1rem}
  .bar .filter{min-width:0;flex:1 1 100%;height:44px;font-size:1rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding:0 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{min-height:40px}
  .bar select.filter{flex:1 1 140px}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px 16px;gap:12px 16px}
  .meta div b{font-size:1.0625rem}
  .pm-cols{grid-template-columns:1fr}
  .act{grid-template-columns:48px minmax(0,1fr)}.act .what{grid-column:2}
  .checkin{flex-direction:column;align-items:stretch}.checkin .bigbtn{width:100%}
  .show-sm{display:block}
  .hide-sm{display:none}
  .kv dd .row-i{width:100%}
  .row-i .filter.mini{flex:1 1 140px;height:42px}
  .row-i .btn{min-height:42px}
  .btn{min-height:42px}
  .form input:not([type=checkbox]),.form select,.cell,.filter{font-size:1rem}
  .sal-f.inline{grid-template-columns:minmax(0,1fr)}
  .cat{grid-template-columns:110px minmax(0,1fr) auto}
  .empty{padding:24px 18px}
  .res{padding:12px 14px}
  .att-chips .ach{flex:1 1 100%;justify-content:space-between}
  .head-row{margin-bottom:12px}
  .grid2{gap:16px}
  .menu-list button{min-height:56px}
  .ledger th,.ledger td{padding:8px 8px}
  table.compact.ledger td,.ledger td.nw{white-space:normal}
  .rr-detail .panel{border-radius:6px}
  .rr-detail{padding:12px 10px}
}
@media (prefers-reduced-motion:no-preference){.alu{transition:width .5s ease-out}}
@media (prefers-reduced-motion:reduce){.busy{animation:none;background:var(--gold)}}
.ck{padding:12px 0;border-bottom:1px solid var(--rule2)}.ck:last-child{border-bottom:0}.ck-l{margin:8px 0 0 4px;padding-left:18px;font-size:var(--fs-sm);color:var(--steel)}.ck-l li{margin:3px 0}
.rg-chk{display:flex;align-items:center;gap:8px;min-height:40px;font-size:var(--fs-sm);cursor:pointer}.rg-chk input{width:18px;height:18px}
.rg-l{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-cap);color:var(--steel)}
#report{display:none}
/* profit charts */
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.pv-bar label{font-size:var(--fs-sm);color:var(--steel)}
.pv-bar select{min-width:260px;max-width:100%}
.panel.pv{padding:18px 20px 16px;margin-bottom:18px}
.panel.pv h3{margin:0 0 2px}
.panel.pv .sub{margin:0 0 16px;max-width:80ch}
.br{display:grid;gap:12px}
.br-row{display:grid;grid-template-columns:minmax(180px,34%) 1fr 116px;gap:16px;align-items:center}
.br-l b{display:block;font-weight:600;font-size:var(--fs-body)}
.br-l small,.pb-v small{display:block;color:var(--faint);font-size:var(--fs-cap);line-height:1.35}
.br-t,.pb-t{position:relative;height:22px}
.br-z,.pb-z{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.br-b{position:absolute;top:2px;height:18px;border-radius:4px}
.br-b.gain,.sw.gain{background:#3A6EA5}.br-b.cost,.sw.cost{background:#C2652F}.br-b.tot,.sw.tot{background:var(--ink)}
.br-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-md)}
.br-tot{padding-top:12px;border-top:1px solid var(--rule2)}
.br-tot .br-v{font-size:var(--fs-h3)}
.pv-leg{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:var(--fs-sm);color:var(--steel)}
.pv-leg span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.pb{display:grid;gap:6px}
.pb-row{display:grid;grid-template-columns:minmax(200px,36%) 1fr 170px;gap:16px;align-items:center;padding:3px 0}
.pb-l{font-size:var(--fs-sm)}
.pb-t{height:16px}
.pb-b{position:absolute;top:3px;height:10px;border-radius:0 4px 4px 0;background:var(--ink)}
.pb-b.neg{background:#C2652F;border-radius:4px 0 0 4px}
.pb-v{text-align:right;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .br-row,.pb-row{grid-template-columns:1fr auto;gap:4px 12px}
  .br-l,.pb-l{grid-column:1/-1}
  .pv-bar select{min-width:0;flex:1}
}
@page{size:A4;margin:12mm 12mm 14mm}
@media print{
  body.rep>*:not(#report){display:none!important}
  body.rep #report{display:block;color:#000;font:10pt/1.45 var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report .rh{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  #report .rh-co{font:700 15pt/1.2 var(--display);letter-spacing:.2px}
  #report .rh-ad{font-size:9pt;color:#444;margin-bottom:8px}
  #report h1{font:700 16pt/1.2 var(--display);margin:0 0 8px}
  #report h2{font:700 11pt/1.3 var(--display);margin:14px 0 5px;padding:3px 6px;background:#E7E7E7;border-left:3px solid #000;break-after:avoid}
  #report .rh-meta{display:flex;gap:28px;margin:0}
  #report .rh-meta dt{font-size:8.5pt;color:#444;margin:0}
  #report .rh-meta dd{margin:0;font-weight:600}
  #report section{break-inside:auto}
  #report .rt{width:100%;border-collapse:collapse;font-size:9.5pt}
  #report .rt th,#report .rt td{border:1px solid #888;padding:3px 6px;text-align:left;vertical-align:top}
  #report .rt th{background:#F0F0F0;font-weight:600}
  #report .rt .num{text-align:right;font-variant-numeric:tabular-nums}
  #report .rt thead{display:table-header-group}
  #report .rt tr{break-inside:avoid}
  #report .rt tfoot td{font-weight:700;background:#F0F0F0}
  #report .rt-sum td{font-size:11pt;font-weight:700}
  #report .rt-note{font-size:9pt;color:#333;margin:8px 0 0}
  #report .rsign{display:flex;justify-content:space-between;gap:24px;margin-top:46px;break-inside:avoid}
  #report .rsign div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center;font-size:9pt}
}
@media print{
  html,body{background:#fff}
  .rail,.top,.no-print,.toast,.busy{display:none!important}
  .col{margin:0}
  main{padding:0;max-width:none}
  .panel{border:0}
}
</style>

const cashSigned = e => e.direction === 'in' ? e.amount : -e.amount;
const cashSum = (S, f) => sum(M.cash.filter(e => (!S.acct || e.account === S.acct) && f(e)), cashSigned);
const cashMatch = S => e => (!S.acct || e.account === S.acct) && (!S.from || e.date >= S.from) && (!S.to || e.date <= S.to)
  && (!lc(S.ft) || [e.date, dt(e.date), e.account, e.party, e.category, e.note, e.ref, e.amount].join(' ').toLowerCase().includes(lc(S.ft)));
const cashDetail = e => [e.category, e.note].filter(Boolean).join(' · ') + (e.ref ? ` (${e.ref})` : '');
function cashDays(S, rows) {
  const m = {}; rows.forEach(e => { const d = m[e.date] = m[e.date] || { date: e.date, in: 0, out: 0 }; if (e.direction === 'in') d.in += e.amount; else d.out += e.amount; });
  return Object.values(m).map(d => ({ ...d, net: d.in - d.out, closing: cashSum(S, x => x.date <= d.date) })).sort((a, b) => a.date.localeCompare(b.date));
}

}

/* party ledger: bills (sales register) against receipts (cash & bank register) */
function partyRows(party, jobs) {
  const rows = [];
  M.register.filter(r => r.party === party && r.amount != null && (jobs || r.kind !== 'job')).forEach(r => rows.push({ date: r.date, o: 0, what: r.kind === 'job' ? `${t('rg_job')} · ${r.id}` : `${t('lg_sale')} · ${t('rg_challan')} ${r.challan_no || r.id}`, dr: r.amount, cr: 0 }));
  if (jobs) M.register.filter(r => r.party === party && r.kind === 'job' && r.paid_on).forEach(r => rows.push({ date: r.paid_on, o: 1, what: `${t('lg_marked')} · ${r.id}`, dr: 0, cr: r.amount }));
  M.cash.filter(e => e.party === party).forEach(e => rows.push({ date: e.date, o: 1, what: (e.direction === 'in' ? '' : t('lg_paid_to') + ' · ') + [e.account, cashDetail(e)].filter(Boolean).join(' · '), dr: e.direction === 'out' ? e.amount : 0, cr: e.direction === 'in' ? e.amount : 0 }));
  rows.sort((a, b) => a.date.localeCompare(b.date) || a.o - b.o);
  let bal = 0; rows.forEach(r => { bal += r.dr - r.cr; r.bal = bal; });
  return rows;
}
function ledgerParties(jobs) {

/* data checks: stock, packing lists, lots, sales and cash must all match */
function dataChecks() {
  const out = [];
  const add = (k, bad) => out.push({ k, bad });
  add('ck_stock', M.negStock.map(p => `${p.name}: ${n0(p.pcs)} / ${n2(p.kg)} kg`));
  if (can('purchases')) add('ck_lots', M.lists.filter(l => l.direction === 'in' && !l.lot).map(l => l.id));
  if (can('rates')) {
    add('ck_sales', M.lists.filter(l => l.direction === 'out' && !l.sales_order && !saleOf(l)).map(l => l.id));
    add('ck_kg', M.register.filter(r => r.kind === 'sale' && r.packing_list).flatMap(r => { const l = M.lists.find(x => x.id === r.packing_list); return !l ? [`${r.id}: ${r.packing_list}?`] : r.kg != null && Math.abs(r.kg - l.kg) > 0.005 ? [`${r.id}: ${n2(r.kg)} vs ${l.id} ${n2(l.kg)} kg`] : []; }));
  }
  if (can('cash')) add('ck_cash', M.register.filter(r => r.kind === 'sale' && r.amount != null && r.paid_mode).flatMap(r => { const got = sum(M.cash.filter(e => e.ref === r.id && e.direction === 'in'), e => e.amount); return Math.abs(got - r.amount) > 0.5 ? [`${r.id} (${r.party}): ${inr(got)} / ${inr(r.amount)}`] : []; }));
  const outB = M.bundles.filter(b => b.direction === 'out' && b.alu != null && b.fin !== 'mill');
  const byLine = {}; outB.forEach(b => { const x = byLine[b.list + '|' + b.profile] = byLine[b.list + '|' + b.profile] || { list: b.list, profile: b.profile, pcs: 0, kg: 0, alu: 0, per: b.boughtPer }; x.pcs += b.pcs; x.kg += b.kg; x.alu += b.alu; });
  const lines = Object.values(byLine).map(x => ({ ...x, pct: x.alu ? (x.kg / x.alu - 1) * 100 : 0 }));
  const med = median(lines.map(x => x.pct)) || 0;
  // weight per length of a profile in each received list: when lots differ a lot, the average misleads
  const lotW = {}; M.lists.filter(l => l.direction === 'in').forEach(l => { const g = {}; l.bundles.forEach(b => { const x = g[b.profile] = g[b.profile] || { kg: 0, pcs: 0 }; x.kg += b.kg; x.pcs += b.pcs; }); Object.entries(g).forEach(([k, x]) => x.pcs && (lotW[k] = lotW[k] || []).push({ list: l.id, per: x.kg / x.pcs })); });
  add('ck_film', lines.filter(x => x.pct < FILM_LO || x.pct > FILM_HI).map(x => { const w = lotW[x.profile] || []; const lo = Math.min(...w.map(v => v.per)), hi = Math.max(...w.map(v => v.per));
    return w.length > 1 && hi / lo > 1.05 ? t('ck_film_lots', { l: x.list, p: x.profile, pct: x.pct.toFixed(1), w: w.map(v => `${v.list} ${n3(v.per)} kg`).join(', ') })
      : t('ck_film_i', { l: x.list, p: x.profile, pct: x.pct.toFixed(1), n: n0(x.pcs), m: x.per ? n0(x.kg / (x.per * (1 + med / 100))) : '?', med: med.toFixed(1) }); }));
  const cw = M.work.filter(w => w.cancelled && w.stage !== 'dispatched');
  add('ck_open', M.work.filter(w => openWO(w) && !M.sales.some(o => o.id === w.sales_order) && w.sales_order).map(w => w.id));
  const flagged = M.bundles.filter(b => b.check);
  return { items: out, flagged, cw };
}

const PV_GAIN = '#3A6EA5', PV_COST = '#C2652F';  // validated pair (lightness, chroma, CVD, contrast on white); profit = ink
function profitParts(rows) {

  const rev = S(p => p.rev), kg = S(p => p.kg), alu = S(p => p.alu), film = S(p => p.film), anodKg = S(p => p.anodKg);
  const filmSold = S(p => p.filmEarn), anod = S(p => p.anodCost), filmCost = S(p => p.filmCost), aluCost = S(p => p.aluCost), profit = S(p => p.profit);
  // profit = margin on the aluminium + film sold at the aluminium rate − anodising − film cost (the margin closes the sum exactly)
  return { rev, kg, alu, film, anodKg, filmSold, anod, filmCost, aluCost, profit, metal: profit - filmSold + anod + filmCost,
    rate: kg ? rev / kg : 0, landed: alu ? aluCost / alu : 0, anodR: anodKg ? anod / anodKg : 0, filmR: film ? filmCost / film : 0 };
}
const pvSigned = v => (v < 0 ? '−' : '+') + inr(Math.abs(v));
function bridgeHtml(x) {
  const steps = [
    { k: 'pv_metal', s: t('pv_metal_s', { kg: n2(x.alu), r: n2(x.rate), c: n2(x.landed) }), v: x.metal },

    { k: 'pv_film_cost', s: t('pv_film_cost_s', { kg: n2(x.film), r: n2(x.filmR) }), v: -x.filmCost }];
  let run = 0; const pos = [0];
  steps.forEach(st => { st.a = run; run += st.v; st.b = run; pos.push(run); });
  const lo = Math.min(0, ...pos), hi = Math.max(0, ...pos), span = (hi - lo) || 1, X = v => ((v - lo) / span * 100).toFixed(2);
  const bar = (a, b, cls) => `<i class="br-b ${cls}" style="left:${X(Math.min(a, b))}%;width:${Math.max(0.5, Math.abs(b - a) / span * 100).toFixed(2)}%"></i>`;

VIEWS.account = () => {
  if (!ONLINE) { view(`<div class="panel empty"><p>${esc(t('offline_only'))}</p></div>`); return; }
  const mineSee = PERM_SEE.filter(k => can(k)), mineDo = PERM_DO.filter(k => can(k));
  view(`<div class="head-row"><div><h2>${esc(t('acc_h'))}</h2><p class="sub" style="margin:0">${esc(t('signed_in_as', { name: uname(ME), role: t(ME.role) }))} · ${esc(t('login_id'))}: ${esc(ME.username)}</p></div></div>
    <div class="grid2"><div class="panel" style="padding:18px 20px"><h3>${esc(t('language'))}</h3><span class="seg"><button type="button" data-lang="en" aria-pressed="${LANG === 'en'}">English</button><button type="button" data-lang="hi" aria-pressed="${LANG === 'hi'}">हिंदी</button></span>
      <h3 style="margin-top:22px">${esc(t('text_size'))}</h3><span class="seg"><button type="button" data-tsize="n" aria-pressed="${!document.documentElement.classList.contains('tl')}">${esc(t('text_normal'))}</button><button type="button" data-tsize="l" aria-pressed="${document.documentElement.classList.contains('tl')}">${esc(t('text_large'))}</button></span>
      ${isMaster() ? '' : `<h3 style="margin-top:22px">${esc(t('your_access'))}</h3><p style="margin:0 0 4px"><b>${esc(t('can_see'))}:</b> ${esc(mineSee.map(k => t('pm_' + k)).join(', ') || '–')}</p><p style="margin:0"><b>${esc(t('can_do'))}:</b> ${esc(mineDo.map(k => t('pm_' + k)).join(', ') || '–')}</p><p class="note" style="margin-top:12px">${esc(t('tracked_note'))}</p>`}
      <h3 style="margin-top:22px">${esc(t('signout'))}</h3><button class="btn" id="so" type="button">${esc(t('signout'))}</button></div>
    <div class="panel" style="padding:18px 20px"><h3>${esc(t('change_pw'))}</h3><form class="form" id="pwf"><label>${esc(t('new_pw'))}<input type="password" id="p1" required minlength="8" autocomplete="new-password"></label><label>${esc(t('confirm_pw'))}<input type="password" id="p2" required minlength="8" autocomplete="new-password"></label><button class="btn primary" type="submit">${esc(t('change_pw'))}</button><p class="msg" id="pwm"></p></form></div></div>`);
  $('#so').onclick = async () => { $('#so').disabled = true; try { await rpc('log_activity', { p_kind: 'sign_out', p_detail: null }); } catch (_) {} await endSession(''); };
  $('#pwf').onsubmit = async e => { e.preventDefault(); const m = $('#pwm'); const a = $('#p1').value, b = $('#p2').value;
    if (a.length < 8) { m.className = 'msg err'; m.textContent = t('pw_short'); return; } if (a !== b) { m.className = 'msg err'; m.textContent = t('pw_mismatch'); return; }
    const { error } = await SB.auth.updateUser({ password: a }); if (error) { m.className = 'msg err'; m.textContent = t('err', { msg: error.message }); } else { m.className = 'msg ok'; m.textContent = t('pw_set'); $('#pwf').reset(); logAct('password'); } };
};
VIEWS.more = () => {
  view(`<h2 style="margin-bottom:12px">${esc(t('more_h'))}</h2><div class="menu-list">${TABS.filter(tb => allowed(tb) && !PRIMARY.includes(tb.k) && (tb.k !== 'account' || ONLINE)).map(tb => `<button type="button" data-go="${tb.k}">${ico(tb.icon)}<span>${esc(t(tb.label))}</span><span class="faint">${tb.ct ? tb.ct() : '›'}</span></button>`).join('')}</div>
    <h3 style="margin:22px 0 8px">${esc(t('language'))}</h3><span class="seg"><button type="button" data-lang="en" aria-pressed="${LANG === 'en'}">English</button><button type="button" data-lang="hi" aria-pressed="${LANG === 'hi'}">हिंदी</button></span>
    <h3 style="margin-top:22px">${esc(t('text_size'))}</h3><span class="seg"><button type="button" data-tsize="n" aria-pressed="${!document.documentElement.classList.contains('tl')}">${esc(t('text_normal'))}</button><button type="button" data-tsize="l" aria-pressed="${document.documentElement.classList.contains('tl')}">${esc(t('text_large'))}</button></span>`);
};

/* ------------------------------ search ------------------------------ */
function renderSearch(text) {
  drawTabs('');
  const master = isMaster();
  const toks = text.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = s => { s = String(s).toLowerCase(); return toks.every(tk => s.includes(tk)); };
  const hl = toks.filter(tk => tk.length >= 2 || /^\d$/.test(tk)).map(tk => tk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = hl.length ? new RegExp('(' + hl.join('|') + ')', 'ig') : null;
  const mk = s => re ? String(s).split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('') : esc(s);   // mark matches, then escape each piece
  const groups = [
    ['g_orders', M.sales.filter(o => hit([o.id, o.party, o.phone, o.taken_by, stLabel(o.status), ...o.lines.map(l => l.profile)].join(' '))).map(o => ({ t: `${o.id} — ${o.party}`, d: `${stLabel(o.status)} · ${t('due')} ${dt(o.due)} · ${itemsTxt(o)}`, r: n0(sum(o.lines, l => l.pcs)) + ' ' + t('pcs'), go: 'sales/' + o.id }))],
    ['g_work', M.work.filter(w => hit([w.id, w.party, w.process, procLabel(w.process), w.shade, sgLabel(w.stage), w.sales_order, ...w.lines.map(l => l.profile)].join(' '))).map(w => ({ t: `${w.id} — ${procLabel(w.process)}${w.shade ? ', ' + w.shade : ''}`, d: `${w.party || ''} · ${sgLabel(w.stage)} · ${itemsTxt(w)}`, r: dt(w.due), go: 'work/' + w.id }))],
    ['g_profiles', (can('stock') ? M.profiles : []).filter(p => hit(`${p.name} ${p.series} ${p.aliases.join(' ')}`)).map(p => ({ t: p.name, d: `${p.series}${p.aliases.length ? ' — ' + p.aliases.join(', ') : ''}`, r: p.kg ? `${n2(p.kg)} kg` : t('no_stock'), go: 'stock/' + p.name }))],
    ['g_bundles', M.bundles.filter(b => hit(`#${b.no} bundle ${b.no} ${b.profile} ${b.supplier_name} ${b.pcs} pcs ${n2(b.kg)} kg ${b.kg} ${b.party} ${b.list} ${b.note}`)).map(b => ({ t: `${t('bundle')} #${b.no} — ${b.profile}`, d: `${b.party}, ${b.list}, ${b.pcs} ${t('pcs')}, ${n3(b.avg)} kg${b.note ? ' — ' + b.note : ''}`, r: `${n2(b.kg)} kg`, go: `lists/${b.list}/${b.no}` }))],
    ['g_lists', M.lists.filter(l => hit(`${l.id} ${l.party} ${l.date} ${dt(l.date)} ${l.lot || ''}`)).map(l => ({ t: `${l.id} — ${l.party}`, d: `${t(l.direction === 'in' ? 'rcv' : 'sent')} ${dt(l.received || l.date)}, ${l.bundles.length} ${t('bundles')}`, r: `${n2(l.kg)} kg`, go: 'lists/' + l.id }))],
    ['g_cons', M.cons.filter(c => hit(`${c.name} ${c.category} ${t('c_' + c.category)} ${c.shade || ''}`)).map(c => ({ t: c.name, d: t('c_' + c.category), r: `${nq(c.qty)} ${c.unit}`, go: 'cons/' + c.id }))],
    ...[
      ['g_lots', M.lots.filter(l => hit(`${l.id} ${l.supplier} ${l.received} ${dt(l.received)} ${l.material_cost} ${n0(l.material_cost)}`)).map(l => ({ t: `${l.id} — ${l.supplier}`, d: `${dt(l.received)}, ₹${n2(l.rate)} / kg`, r: inr(l.total), go: 'purchases' }))],
      ['g_exp', M.expenses.filter(e => hit(`${e.category} ${e.description} ${e.party || ''} ${e.amount} ${n0(e.amount)} ${dt(e.date)} ${e.sales_order || ''} ${e.work_order || ''}`)).map(e => ({ t: e.description || e.category, d: `${e.category}, ${dt(e.date)}`, r: inr(e.amount), go: 'expenses/' + e.id }))]].filter(g => g[0] === 'g_lots' ? can('purchases') : can('expenses'))
  ].filter(g => g[1].length);
  const total = sum(groups, g => g[1].length);
  $('#view').innerHTML = `<div class="head-row"><div><h2>${esc(total ? (total === 1 ? t('result1', { q: text }) : t('results', { n: total, q: text })) : t('nothing_for', { q: text }))}</h2><p class="sub" style="margin:0">${esc(total ? t('res_hint') : t('res_try'))}</p></div></div>
    ${groups.map(([g, rs]) => `<div class="res-group"><h3>${esc(t(g))}<span>${rs.length}</span></h3><div class="panel">${rs.slice(0, 60).map(r => `<div class="res" data-go="${esc(r.go)}"><span class="t">${mk(r.t)}</span><span class="d">${mk(r.d)}</span><span class="r">${esc(r.r)}</span></div>`).join('')}${rs.length > 60 ? `<p class="sub" style="padding:10px 14px;margin:0">${esc(t('more_n', { n: rs.length - 60 }))}</p>` : ''}</div></div>`).join('')}`;
}
document.addEventListener('click', e => { if (e.target.closest('.res')) $('#q').value = ''; if (e.target.closest('[data-print]')) window.print(); }, true);

/* ------------------------------ login + boot ------------------------------ */
function showLogin(message, prefill) {
  const old = document.getElementById('lock'); if (old) old.remove();
  document.body.classList.add('locked');
  document.body.insertAdjacentHTML('afterbegin', `<div class="lock" id="lock">${BADGE}<form id="lockf" autocomplete="on" novalidate>
    <div class="head"><div><h1>${esc(t('app'))}</h1><p class="firm">${esc(COMPANY)}</p></div><span class="seg"><button type="button" data-lang="en" aria-pressed="${LANG === 'en'}">EN</button><button type="button" data-lang="hi" aria-pressed="${LANG === 'hi'}">हिं</button></span></div>
    <label class="f" for="lid">${esc(t('login_id'))}</label><input id="lid" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="80" required value="${esc(prefill || '')}">
    <label class="f" for="pw">${esc(t('password'))}</label><div class="pwbox"><input id="pw" name="password" type="password" autocomplete="current-password" maxlength="72" required><button class="eye" type="button" id="eye" aria-controls="pw">${esc(t('show_pw'))}</button></div>
    <p class="caps" id="caps" hidden>${esc(t('caps_on'))}</p>
    <label class="keep"><input type="checkbox" id="keep" ${store.get('acta.keep') !== '0' ? 'checked' : ''}> ${esc(t('keep'))}</label>
    <button id="go" type="submit">${esc(t('signin'))}</button>
    <p class="err" id="err" role="alert">${esc(message || '')}</p></form></div>`);
  const id = $('#lid'), pw = $('#pw'), btn = $('#go'), err = $('#err');
  (prefill ? pw : id).focus();
  $('#eye').onclick = () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; $('#eye').textContent = t(show ? 'hide_pw' : 'show_pw'); pw.focus(); };
  const capsCheck = e => { if (e.getModifierState) $('#caps').hidden = !e.getModifierState('CapsLock'); };
  pw.addEventListener('keydown', capsCheck); pw.addEventListener('keyup', capsCheck);
  $('#lockf').onsubmit = async e => {
    e.preventDefault(); err.textContent = '';
    const login = id.value.trim().toLowerCase();
    if (!login || !pw.value) { err.textContent = t('bad_login'); (login ? pw : id).focus(); return; }
    btn.disabled = true; btn.textContent = t('signing');
    store.set('acta.keep', $('#keep').checked ? '1' : '0'); makeClient();
    const email = login.includes('@') ? login : `${login}@acta.local`;
    let res;
    try { res = await SB.auth.signInWithPassword({ email, password: pw.value }); } catch (ex) { res = { error: ex }; }
    if (res.error) { btn.disabled = false; btn.textContent = t('signin'); const m = String(res.error.message || ''); err.textContent = /invalid|credential/i.test(m) ? t('bad_login') : /banned/i.test(m) ? t('off_login') : /fetch|network/i.test(m) ? t('net_err') : /rate|too many/i.test(m) ? t('err', { msg: m }) : t('err', { msg: m }); pw.select(); return; }
    pw.value = '';
    const ok = await afterSignIn(res.data.user, 'sign_in');
    if (!ok) { btn.disabled = false; btn.textContent = t('signin'); }
  };
}
let SIGNING_OUT = false;
async function endSession(message) {
  if (SIGNING_OUT) return; SIGNING_OUT = true;
  try { await SB.auth.signOut(); } catch (_) {}
  ME = null; M = null; RAW = null; Object.keys(UI).forEach(k => delete UI[k]);
  $('#view').innerHTML = ''; history.replaceState(null, '', location.pathname + location.search);
  showLogin(message); SIGNING_OUT = false;
}
async function afterSignIn(user, how) {
  try {
    const rows = await q('app_users');
    ME = rows.find(r => r.id === user.id) || null;
  } catch (e) { ME = null; }
  if (!ME || !ME.active) { try { await SB.auth.signOut(); } catch (_) {} showLogin(t('off_login')); return false; }
  if (!store.get('acta.lang') && ME.lang) LANG = ME.lang;
  if (SB.auth.onAuthStateChange && !SB._actaWatch) { SB._actaWatch = true; SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && ME && !SIGNING_OUT) endSession(t('session_end')); }); }
  if (!(await reload(false))) {
    const lk = document.getElementById('lock');
    if (ME && lk && !$('#lockf')) lk.innerHTML = `${BADGE}<p role="alert">${esc(LOAD_ERR)}</p><button class="btn" type="button" data-retry>${esc(t('retry'))}</button>`;
    return false;
  }
  const lk = document.getElementById('lock'); if (lk) lk.remove();
  document.body.classList.remove('locked');
  logAct(how || 'open'); route();
  return true;
}
/* ------------------------------ loading and refreshing ------------------------------ */
let LOADING = false, SIG = '', busyN = 0, LOAD_ERR = '';
const sigOf = R => { const s = JSON.stringify(R, (k, v) => k === 'activity_log' ? undefined : v); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; };
const isAuthErr = e => /jwt|refresh token|not authenticated|invalid claim|PGRST30[0-9]/i.test(String((e && (e.message || e.code)) || e));
function showBusy() { busyN++; if (!$('#busy')) { const b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; b.setAttribute('aria-hidden', 'true'); document.body.appendChild(b); } }
function hideBusy() { busyN = Math.max(0, busyN - 1); if (!busyN) { const b = $('#busy'); if (b) b.remove(); } }
async function reload(rerender, opts = {}) {
  LOADING = true; if (!opts.quiet) showBusy();
  try { RAW = await loadRaw(); M = buildModel(RAW); LOADED_AT = new Date(); SIG = sigOf(RAW); }
  catch (e) {
    if (e instanceof SignedOut) { await endSession(e.message); return false; }
    if (isAuthErr(e)) { await endSession(t('session_end')); return false; }
    if (opts.quiet) return false;
    if (!M) { LOAD_ERR = t('load_err', { msg: e.message || e }); const er = $('#err'); if (er) er.textContent = LOAD_ERR; else if (!document.getElementById('lock')) $('#view').innerHTML = `<div class="panel empty"><p>${esc(LOAD_ERR)}</p></div>`; }
    else toast(t('load_err', { msg: e.message || e }), 'err');
    return false;
  } finally { LOADING = false; if (!opts.quiet) hideBusy(); }
  drawHeader();
  if (rerender) rerenderNow();
  return true;
}
function rerenderNow() { $('#newdata').hidden = true; if ($('#q').value.trim()) renderSearch($('#q').value.trim()); else route({ keep: true }); }
$('#newdata').onclick = rerenderNow;
document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) location.reload(); });
$('#refresh').onclick = () => reload(true);
/* Background refresh every 3 minutes (and when the app comes back to the front). It never redraws
   while someone is typing or has just touched the page: then a "New updates" button appears instead. */
let lastTouch = Date.now();
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true, capture: true }));
document.addEventListener('input', e => { const f = e.target.closest && e.target.closest('form'); if (f && f.id !== 'lockf') f.dataset.dirty = '1'; }, true);
const editing = () => { const a = document.activeElement; return !!(a && a !== $('#q') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) || !!document.querySelector('tr.sal-edit, form[data-dirty]'); };
async function quietRefresh() {
  if (!ONLINE || !ME || !M || LOADING || document.visibilityState !== 'visible') return;
  const before = SIG;
  if (!(await reload(false, { quiet: true }))) return;
  if (SIG === before) return;
  if (editing() || Date.now() - lastTouch < 20e3) { $('#newdata').hidden = false; return; }
  rerenderNow();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && LOADED_AT && Date.now() - LOADED_AT > 60e3) quietRefresh(); });
setInterval(quietRefresh, 180e3);

(async function boot() {
  drawHeader();
  if (SNAP) { ME = null; M = buildModel(SNAP); route(); return; }
  if (!ONLINE) {
    const msg = CFG.url ? t('net_err') : 'The data file is missing. Keep data.js next to this page, or open nkbapex.in.';
    document.body.classList.add('locked'); document.body.innerHTML = `<div class="lock">${BADGE}<form><h1>${esc(t('app'))}</h1><p class="firm">${esc(msg)}</p></form></div>`; return;
  }
  makeClient();
  let session = null;
  try { const r = await SB.auth.getSession(); session = r.data && r.data.session; } catch (_) {}
  if (session && session.user) {
    document.body.classList.add('locked');
    document.body.insertAdjacentHTML('afterbegin', `<div class="lock" id="lock">${BADGE}<p role="status">${esc(t('loading'))}</p></div>`);
    await afterSignIn(session.user, 'open');
    return;
  }
  showLogin();
})();
</script>
