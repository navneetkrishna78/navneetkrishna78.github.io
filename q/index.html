<style>
/* Customer copy of one quotation, opened from its secret link nkbapex.in/q/#token. One A4 sheet of
   company stationery on a mill-grey desk; on phones the item tables turn into a list; prints as A4. */
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/barlow-600.woff2) format("woff2")}
:root{
  --desk:#E4E6E8; --paper:#FFFFFF; --ink:#141414; --steel:#545454; --faint:#6E6E6E;
  --rule:#D5D7DA; --band:#0B0B0B; --gold:#E2C545; --gold-ink:#6B5604; --gold-soft:#FAF2D2; --row:#F6F7F8;
  --display:"Barlow","Bahnschrift","DIN Alternate","Segoe UI",Roboto,Arial,sans-serif;
  --text:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--desk);color:var(--ink);font:500 15px/1.45 var(--text);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:210mm;margin:0 auto 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--steel);font-size:.9rem}
.bar span{flex:1 1 220px;min-width:0}
.bar button{font:600 .95rem var(--display);letter-spacing:.02em;background:var(--band);color:#fff;border:0;border-radius:8px;padding:11px 18px;min-height:44px;cursor:pointer}
.bar button:hover{background:#2a2a2a}
.bar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sheet{background:var(--paper);max-width:210mm;margin:0 auto;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.10);display:flex;flex-direction:column}
.lh{background:var(--band);color:#F4F4F4;display:flex;align-items:center;gap:16px;padding:18px 26px 16px;border-bottom:4px solid var(--gold);flex-wrap:wrap}
.lh img{width:64px;height:64px;border-radius:50%;flex:none}
.lh .co{flex:1 1 240px;min-width:0}
.lh .co b{display:block;font:600 1.3rem/1.15 var(--display);letter-spacing:.01em;text-wrap:balance}
.lh .co span{display:block;color:#B9B9B9;font-size:.86rem;margin-top:3px}
.lh .doc{font:600 1.05rem/1 var(--display);letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.body{padding:20px 26px 22px;display:flex;flex-direction:column;gap:16px}
.state{margin:8px 0;padding:18px;border:1px solid var(--rule);background:var(--row);font-size:1rem}
.state b{display:block;font:600 1.1rem var(--display);margin-bottom:4px}
.state button{margin-top:12px;font:600 .95rem var(--display);background:var(--band);color:#fff;border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer}
.meta{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.lbl{font:600 .75rem/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.to b{font:600 1.08rem/1.25 var(--display)}
.to p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:.9rem}
.kv dt{color:var(--steel)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-.05em;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.intro{margin:0;color:var(--steel)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.86rem;min-width:560px}
th{font:600 .72rem/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--ink)}
td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.n{text-align:right;white-space:nowrap}
.c{text-align:center;width:28px;color:var(--faint)}
caption{caption-side:top;text-align:left;padding:0 0 6px;font:600 .98rem/1.2 var(--display)}
caption small{font:500 .84rem var(--text);color:var(--gold-ink);margin-left:8px;letter-spacing:.01em}
tfoot td{font-weight:600;background:var(--row);border-bottom:1.5px solid var(--ink)}
.sub{color:var(--faint)}
/* phones: the same lines as a list */
.ml{display:none}
.ml h3{margin:0 0 2px;font:600 1rem/1.25 var(--display)}
.ml h3 small{display:block;font:500 .86rem var(--text);color:var(--gold-ink);margin-top:2px}
.mi{padding:9px 0;border-bottom:1px solid var(--rule)}
.mi-t{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mi-t b{white-space:nowrap;font-variant-numeric:tabular-nums}
.mi-s{color:var(--steel);font-size:.88rem;margin-top:2px;font-variant-numeric:tabular-nums}
.mt{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--row);border-bottom:1.5px solid var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mt span:last-child{white-space:nowrap}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:22px;align-items:start}
.tot{border:1px solid var(--rule)}
.tot div{display:flex;justify-content:space-between;gap:12px;padding:5px 12px;font-variant-numeric:tabular-nums;font-size:.9rem}
.tot div+div{border-top:1px solid var(--rule)}
.tot .tx{font-weight:600}
.tot .gt{background:var(--gold-soft);border-top:1.5px solid var(--ink);font:600 1.08rem/1.3 var(--display);padding-block:9px}
.wt{margin:0;padding:8px 12px;border:1.5px solid var(--ink);background:var(--gold-soft);font-size:.9rem;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.words{margin:6px 0 0;font-size:.84rem;color:var(--steel)}
ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.86rem;color:var(--steel)}
.sign{margin-top:18px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.sign p{margin:0}
.sign p+p{margin-top:8px;color:var(--steel)}
.sign .line{height:44px;border-bottom:1px solid var(--rule);max-width:260px}
.sign b{font:600 .95rem var(--display);margin-top:4px}
.foot{border-top:1px solid var(--rule);padding:8px 26px 12px;color:var(--faint);font-size:.8rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot:empty{display:none}
@media (max-width:600px){
  .meta,.bottom{grid-template-columns:minmax(0,1fr)}
  .lh{padding:16px}.body{padding:16px}.foot{padding:8px 16px 12px}
  .lh img{width:52px;height:52px}
  .tw{display:none}.ml{display:block}
  .bottom>div:last-child{order:-1}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0;font-size:11.6px}
  .bar{display:none}
  .lh{padding:14px 26px 12px}
  .sheet{box-shadow:none;max-width:none;width:210mm}
  .lh,.tot .gt,tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{display:block;overflow:visible}.ml{display:none}
  .meta{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .bottom{grid-template-columns:minmax(0,1fr) minmax(0,300px)}
  table{min-width:0}
  .body{gap:11px;padding:18px 26px 16px}
  td{padding:5px 8px}
  .sign .line{height:38px}
}
</style>
</head>
